  ];

  const VOICE_CHANGER_PRESETS = {
    none: { label: 'Original', detune: 0, lowPass: 20000, highPass: 20, distortion: 0, gain: 1 },
    deep: { label: 'Deep', detune: -320, lowPass: 3200, highPass: 55, distortion: 0.04, gain: 1.06 },
    bright: { label: 'Bright', detune: 220, lowPass: 9500, highPass: 180, distortion: 0, gain: 1.02 },
    radio: { label: 'Radio', detune: 0, lowPass: 2600, highPass: 360, distortion: 0.22, gain: 1.05 },
    robot: { label: 'Robot', detune: -110, lowPass: 1700, highPass: 240, distortion: 0.38, gain: 0.96 }
  };

  const QUICK_SPEED_PRESETS = [
    ['Slow', 0.75],
    ['Normal', 1],
    ['Fast', 1.25],
    ['Turbo', 1.5]
  ];

  const ROBLOX_RISK_WORDS = [
    'alexsombra', 'angel', 'ce_que', 'cintamu', 'dbagas', 'dear_mantan', 'dimana_hatimu',
    'est_ce', 'feast', 'for_revenge', 'helena', 'hujan_badai', 'jakarta_hari_ini',
    'jogja_hip_hop', 'leona', 'love_how_it_hurts', 'mangan', 'my_chemical_romance',
    'nina', 'once_again', 'rindu', 'stereo_wall', 'syahiba', 'this_love'
  ];

  function normalizeLicenseText(value = '') {
    return String(value).toLowerCase().replace(/[^a-z0-9]+/g, '_');
  }

  function getRobloxUploadWarnings(nextClips) {
    const warnings = [];
    const riskyClips = nextClips.filter(clip => {
      const normalized = normalizeLicenseText(clip.name);
      return ROBLOX_RISK_WORDS.some(word => normalized.includes(word));
    });
    if (riskyClips.length) {
      warnings.push(`Risky title detected: ${riskyClips.slice(0, 3).map(clip => clip.name).join(', ')}. Use only original/licensed audio before uploading to Roblox.`);
    }
    const longClips = nextClips.filter(clip => (clip.duration || 0) > 360);
    if (longClips.length) {
      warnings.push('Roblox uploads are easier to review when mixes are short and clean. Consider trimming tracks longer than 6 minutes.');
    }
    return warnings;
  }

  function createDistortionCurve(amount = 0) {
    const n = 256;
    const curve = new Float32Array(n);
    if (amount <= 0) {
      for (let i = 0; i < n; i++) curve[i] = (i / (n - 1)) * 2 - 1;
      return curve;
    }
    const k = amount * 70;
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      curve[i] = ((Math.PI + k) * x) / (Math.PI + k * Math.abs(x));
    }
    return curve;
  }

  function makeSoundEffectBuffer(ctx, kind) {
    const secondsByKind = { crowd: 2.1, transition: 2, bass_drop: 1.8, reverb_impact: 1.8, cinematic_boom: 2 };
    const seconds = secondsByKind[kind] || 1.15;
    const buffer = ctx.createBuffer(2, Math.floor(ctx.sampleRate * seconds), ctx.sampleRate);
    for (let channel = 0; channel < 2; channel++) {
      const data = buffer.getChannelData(channel);
      for (let i = 0; i < data.length; i++) {
        const t = i / ctx.sampleRate;
        const p = i / data.length;
        const noise = Math.random() * 2 - 1;
        let sample = 0;
        if (kind === 'air_horn') sample = Math.sin(2 * Math.PI * (430 + Math.sin(t * 20) * 40) * t) * (1 - p) * 0.85;
        else if (kind === 'explosion') sample = noise * Math.pow(1 - p, 2.8);
        else if (kind === 'bass_drop') sample = Math.sin(2 * Math.PI * (160 - 120 * p) * t) * Math.pow(1 - p, 0.8);
        else if (kind === 'crowd') sample = (noise * 0.45 + Math.sin(t * 90) * 0.08) * Math.sin(Math.PI * p);
        else if (kind === 'echo_hit') sample = Math.sin(2 * Math.PI * 620 * t) * Math.pow(1 - p, 4);
        else if (kind === 'laser') sample = Math.sin(2 * Math.PI * (1200 - 900 * p) * t) * Math.pow(1 - p, 1.3);
        else if (kind === 'scratch') sample = Math.sin(2 * Math.PI * (280 + Math.sin(t * 55) * 210) * t) * (Math.sin(t * 75) > 0 ? 1 : -1) * (1 - p);
        else if (kind === 'transition') sample = noise * Math.pow(p, 1.5) * 0.7 + Math.sin(2 * Math.PI * (220 + 600 * p) * t) * p * 0.35;
        else if (kind === 'reverb_impact') sample = (Math.sin(2 * Math.PI * 94 * t) + noise * 0.4) * Math.pow(1 - p, 2);
        else if (kind === 'cinematic_boom') sample = Math.sin(2 * Math.PI * (72 - 28 * p) * t) * Math.pow(1 - p, 1.6) + noise * Math.pow(1 - p, 5) * 0.2;
        else if (kind === 'tiktok') sample = Math.sin(2 * Math.PI * (520 + Math.sin(t * 18) * 300) * t) * Math.sin(Math.PI * p);
        else sample = Math.sin(2 * Math.PI * (300 + 500 * Math.sin(t * 8)) * t) * Math.pow(1 - p, 1.8);
        data[i] = Math.max(-1, Math.min(1, sample * (channel === 0 ? 1 : 0.94)));
      }
    }
    return buffer;
  }

  function AdvancedAudioStudioSection() {
    const timelineRef = useRef(null);
    const visualizerRef = useRef(null);
    const audioCtxRef = useRef(null);
    const buffersRef = useRef({});
    const sourcesRef = useRef([]);
    const nodesRef = useRef(null);
    const startedAtRef = useRef(0);
    const playheadRef = useRef(0);
    const rafRef = useRef(null);
    const visualRafRef = useRef(null);
    const historyRef = useRef([]);
    const futureRef = useRef([]);
    const controlsRef = useRef(ADVANCED_DEFAULT_CONTROLS);
    const clientVoiceInputRef = useRef(null);
    const musicInputRef = useRef(null);
    const effectInputRef = useRef(null);
    const mediaRecorderRef = useRef(null);
    const mediaStreamRef = useRef(null);
    const recordChunksRef = useRef([]);
    const recordTimerRef = useRef(null);
    const dragStateRef = useRef(null);
    const hoverStateRef = useRef(null);
    const scrubWasPlayingRef = useRef(false);

    const [clips, setClips] = useState([]);
    const [selectedId, setSelectedId] = useState(null);
    const [controls, setControls] = useState(ADVANCED_DEFAULT_CONTROLS);
    const [currentTime, setCurrentTime] = useState(0);
    const [isPlaying, setIsPlaying] = useState(false);
    const [status, setStatus] = useState('Upload original/licensed audio, add music or effects, then export OGG or MP3 for Roblox.');
    const [licenseConfirmed, setLicenseConfirmed] = useState(false);
    const [isExporting, setIsExporting] = useState(false);
    const [isRecordingVoice, setIsRecordingVoice] = useState(false);
    const [recordSeconds, setRecordSeconds] = useState(0);
    const [timelineCursor, setTimelineCursor] = useState('crosshair');
    const [editorPanel, setEditorPanel] = useState('basic');
    const [readyDownload, setReadyDownload] = useState(null);
    const [timelineTool, setTimelineTool] = useState('move');

    function getClipTimelineEnd(clip, values = controlsRef.current) {
      const rate = Math.max(0.25, (values.speed || 1) * (clip.speed || 1));
      const outputDuration = clip.loop ? clip.duration * 2 : clip.duration / rate;
      const buffer = buffersRef.current[clip.bufferId];
      const sourceEnd = buffer ? (clip.offset || 0) + buffer.duration : clip.duration;
      return clip.start + Math.max(outputDuration, clip.duration, sourceEnd - (clip.offset || 0));
    }

    const projectLength = Math.max(20, ...clips.map(clip => getClipTimelineEnd(clip)));
    const selectedClip = clips.find(clip => clip.id === selectedId);

    useEffect(() => {
      controlsRef.current = controls;
      applyAdvancedControls();
      drawTimeline();
    }, [controls]);

    useEffect(() => {
      drawTimeline();
    }, [clips, selectedId, currentTime]);

    useEffect(() => {
      drawVisualizerIdle();
      return () => {
        stopAdvancedPlayback();
        cleanupVoiceRecorder();
      };
    }, []);

    useEffect(() => {
      return () => {
        if (readyDownload?.url) URL.revokeObjectURL(readyDownload.url);
      };
    }, [readyDownload]);

    useEffect(() => {
      const onWindowPointerMove = event => handleTimelineDragMove(event);
      const onWindowPointerUp = () => finishTimelineDrag();
      window.addEventListener('pointermove', onWindowPointerMove);
      window.addEventListener('pointerup', onWindowPointerUp);
      window.addEventListener('pointercancel', onWindowPointerUp);
      return () => {
        window.removeEventListener('pointermove', onWindowPointerMove);
        window.removeEventListener('pointerup', onWindowPointerUp);
        window.removeEventListener('pointercancel', onWindowPointerUp);
      };
    }, [clips, projectLength, selectedId]);

    function getAudioContext() {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) throw new Error('Web Audio API is not supported in this browser.');
      if (!audioCtxRef.current) audioCtxRef.current = new AudioCtor();
      return audioCtxRef.current;
    }

    function snapshot(nextClips = clips, nextControls = controls) {
      return { clips: nextClips.map(({ bufferId, ...rest }) => ({ ...rest, bufferId })), controls: { ...nextControls }, selectedId };
    }

    function snapshotForClips(nextClips, nextSelected = selectedId) {
      return {
        clips: nextClips.map(({ bufferId, ...rest }) => ({ ...rest, bufferId })),
        controls: { ...controlsRef.current },
        selectedId: nextSelected
      };
    }

    function commit(nextClips, nextSelected = selectedId, nextControls = controls) {
      historyRef.current.push(snapshot());
      futureRef.current = [];
      setClips(nextClips);
      setSelectedId(nextSelected);
      if (nextControls !== controls) setControls(nextControls);
      const warnings = getRobloxUploadWarnings(nextClips);
      if (warnings.length) setStatus(warnings[0]);
    }

    function restore(state) {
      setClips(state.clips.map(normalizeClip));
      setControls(state.controls);
      setSelectedId(state.selectedId || null);
      stopAdvancedPlayback();
    }

    function undo() {
      const prev = historyRef.current.pop();
      if (!prev) return;
      futureRef.current.push(snapshot());
      restore(prev);
      setStatus('Undo applied.');
    }

    function redo() {
      const next = futureRef.current.pop();
      if (!next) return;
      historyRef.current.push(snapshot());
      restore(next);
      setStatus('Redo applied.');
    }

    function normalizeClip(clip) {
      return {
        speed: 1,
        pitch: 0,
        voicePreset: clip.type === 'voice' ? 'none' : null,
        ...clip
      };
    }

    function createClip(name, buffer, start = currentTime, type = 'audio', libraryId = null) {
      const id = `clip_${Date.now()}_${Math.random().toString(16).slice(2)}`;
      buffersRef.current[id] = buffer;
      return {
        id,
        bufferId: id,
        libraryId,
        name,
        type,
        start: Math.max(0, start),
        offset: 0,
        duration: buffer.duration,
        volume: type === 'effect' ? 0.85 : type === 'voice' ? 1.05 : 1,
        speed: 1,
        pitch: 0,
        fadeIn: 0,
        fadeOut: 0,
        loop: false,
        pan: 0,
        muted: false,
        voicePreset: type === 'voice' ? 'none' : null
      };
    }

    async function importAudioFile(file, type = 'audio', start = currentTime, label = file?.name) {
      try {
        const ctx = getAudioContext();
        setStatus(`Decoding ${file.name}...`);
        const arrayBuffer = await file.arrayBuffer();
        const buffer = await ctx.decodeAudioData(arrayBuffer.slice(0));
        const clip = createClip(label || file.name, buffer, start, type);
        const nextClips = [...clips, clip];
        commit(nextClips, clip.id);
        const warnings = getRobloxUploadWarnings(nextClips);
        if (warnings.length) {
          setStatus(warnings[0]);
          return;
        }
        if (type === 'voice') {
          setStatus(`${clip.name} added to the voice lane. Client voice is ready to edit.`);
        } else {
          setStatus(`${clip.name} added to multitrack timeline.`);
        }
      } catch (error) {
        setStatus('Could not decode that file. Try MP3, WAV, or M4A.');
      }
    }

    function cleanupVoiceRecorder() {
      if (recordTimerRef.current) {
        clearInterval(recordTimerRef.current);
        recordTimerRef.current = null;
      }
      if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
        try { mediaRecorderRef.current.stop(); } catch (error) {}
      }
      if (mediaStreamRef.current) {
        mediaStreamRef.current.getTracks().forEach(track => track.stop());
        mediaStreamRef.current = null;
      }
      mediaRecorderRef.current = null;
      recordChunksRef.current = [];
      setIsRecordingVoice(false);
      setRecordSeconds(0);
    }

    function handleVoiceFile(file) {
      if (!file) return;
      importAudioFile(file, 'voice', 0, `Client Voice - ${file.name}`);
    }

    async function startVoiceRecording() {
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        setStatus('Voice recording needs microphone permission and a browser with MediaRecorder support.');
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaStreamRef.current = stream;
        recordChunksRef.current = [];
        const recorder = new MediaRecorder(stream);
        mediaRecorderRef.current = recorder;
        recorder.ondataavailable = event => {
          if (event.data && event.data.size > 0) recordChunksRef.current.push(event.data);
        };
        recorder.onstop = async () => {
          const blob = new Blob(recordChunksRef.current, { type: recorder.mimeType || 'audio/webm' });
          const extension = blob.type.includes('mp4') ? 'm4a' : blob.type.includes('ogg') ? 'ogg' : 'webm';
          cleanupVoiceRecorder();
          if (!blob.size) {
            setStatus('Recording stopped, but no audio was captured.');
            return;
          }
          const voiceFile = new File([blob], `client-voice-${Date.now()}.${extension}`, { type: blob.type });
          await importAudioFile(voiceFile, 'voice', 0, 'Recorded Client Voice');
        };
        recorder.start();
        setIsRecordingVoice(true);
        setRecordSeconds(0);
        recordTimerRef.current = setInterval(() => {
          setRecordSeconds(prev => prev + 1);
        }, 1000);
        setStatus('Recording client voice... click Stop Recording when the take is done.');
      } catch (error) {
        cleanupVoiceRecorder();
        setStatus('Microphone access was blocked. You can still upload a voice file instead.');
      }
    }

    function stopVoiceRecording() {
      if (!mediaRecorderRef.current || mediaRecorderRef.current.state === 'inactive') return;
      if (recordTimerRef.current) {
        clearInterval(recordTimerRef.current);
        recordTimerRef.current = null;
      }
      setStatus('Processing recorded voice...');
      mediaRecorderRef.current.stop();
    }

    function addLibraryEffect(kind, start = currentTime) {
      const ctx = getAudioContext();
      const item = SFX_LIBRARY.find(([id]) => id === kind);
      const buffer = makeSoundEffectBuffer(ctx, kind);
      const clip = createClip(item ? item[1] : 'Sound Effect', buffer, start, 'effect', kind);
      commit([...clips, clip], clip.id);
      setStatus(`${clip.name} added at ${formatStudioTime(start)}.`);
    }

    function updateClip(id, patch) {
      const next = clips.map(clip => clip.id === id ? normalizeClip({ ...clip, ...patch }) : clip);
      commit(next, id);
    }

    function setClipSpeed(speed) {
      if (!selectedClip) return;
      updateClip(selectedClip.id, { speed });
      setStatus(`Clip speed set to ${speed.toFixed(2)}x.`);
    }

    function cutSelected() {
      if (!selectedClip) return;
      commit(clips.filter(clip => clip.id !== selectedClip.id), null);
      setStatus('Selected clip cut from timeline.');
    }

    function cutAtPlayhead() {
      const target = selectedClip || clips.find(clip => currentTime > clip.start && currentTime < clip.start + clip.duration);
      if (!target) {
        setStatus('Pilih clip atau taruh playhead di tengah clip untuk cut.');
        return;
      }
      if (currentTime > target.start && currentTime < target.start + target.duration) {
        const splitAt = currentTime - target.start;
        const first = { ...target, duration: splitAt };
        const second = {
          ...target,
          id: `clip_${Date.now()}_cut`,
          bufferId: `clip_${Date.now()}_cut_buffer`,
          start: currentTime,
          offset: target.offset + splitAt,
          duration: target.duration - splitAt
        };
        buffersRef.current[second.bufferId] = buffersRef.current[target.bufferId];
        commit(clips.map(clip => clip.id === target.id ? first : clip).concat(second), second.id);
        setStatus('Clip cut at playhead.');
        return;
      }
      commit(clips.filter(clip => clip.id !== target.id), null);
      setStatus('Clip deleted.');
    }

    function splitSelected() {
      if (!selectedClip || currentTime <= selectedClip.start || currentTime >= selectedClip.start + selectedClip.duration) return;
      const splitAt = currentTime - selectedClip.start;
      const first = { ...selectedClip, duration: splitAt };
      const second = {
        ...selectedClip,
        id: `clip_${Date.now()}_split`,
        start: currentTime,
        offset: selectedClip.offset + splitAt,
        duration: selectedClip.duration - splitAt
      };
      buffersRef.current[second.id] = buffersRef.current[selectedClip.bufferId];
      second.bufferId = second.id;
      commit(clips.map(clip => clip.id === selectedClip.id ? first : clip).concat(second), second.id);
      setStatus('Clip split at playhead.');
    }

    function trimToPlayhead(side) {
      if (!selectedClip) return;
      if (side === 'left' && currentTime > selectedClip.start && currentTime < selectedClip.start + selectedClip.duration) {
        const delta = currentTime - selectedClip.start;
        updateClip(selectedClip.id, { start: currentTime, offset: selectedClip.offset + delta, duration: selectedClip.duration - delta });
        setStatus('Left side trimmed to playhead.');
      }
      if (side === 'right' && currentTime > selectedClip.start && currentTime < selectedClip.start + selectedClip.duration) {
        updateClip(selectedClip.id, { duration: currentTime - selectedClip.start });
        setStatus('Right side trimmed to playhead.');
      }
    }

    async function mergeToOneClip() {
      if (!clips.length) return;
      setStatus('Merging timeline into one clip...');
      const rendered = await renderAdvancedMixBuffer();
      const clip = createClip('Merged Project Mix', rendered, 0, 'audio');
      commit([clip], clip.id);
      setStatus('Timeline merged into a single editable clip.');
    }

    function saveProject() {
      const data = {
        savedAt: new Date().toISOString(),
        controls,
        clips: clips.map(({ id, bufferId, name, type, start, offset, duration, volume, speed, pitch, fadeIn, fadeOut, loop, pan, muted, libraryId, voicePreset }) => ({
          id, bufferId, name, type, start, offset, duration, volume, speed, pitch, fadeIn, fadeOut, loop, pan, muted, libraryId, voicePreset
        }))
      };
      localStorage.setItem('norsdevAdvancedAudioProject', JSON.stringify(data));
      setStatus('Project layout saved locally. Uploaded audio buffers stay available in this session.');
    }

    function loadProject() {
      const raw = localStorage.getItem('norsdevAdvancedAudioProject');
      if (!raw) {
        setStatus('No saved project found.');
        return;
      }
      const data = JSON.parse(raw);
      const ctx = getAudioContext();
      const restored = [];
      data.clips.forEach(clip => {
        if (clip.libraryId) {
          const buffer = makeSoundEffectBuffer(ctx, clip.libraryId);
          buffersRef.current[clip.id] = buffer;
          restored.push(normalizeClip(clip));
        } else if (buffersRef.current[clip.bufferId]) {
          restored.push(normalizeClip(clip));
        }
      });
      setControls(data.controls || ADVANCED_DEFAULT_CONTROLS);
      setClips(restored);
      setSelectedId(restored[0]?.id || null);
      setStatus('Project layout loaded. Re-import original audio files if a track is missing.');
    }

    function createAdvancedMaster(ctx, input, output, values, useAnalyser = false) {
      const mid = ctx.createBiquadFilter();
      mid.type = 'peaking';
      mid.frequency.value = 950;
      mid.Q.value = 1.1;
      mid.gain.value = values.eqMid;
      const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      const mapped = { ...values, bass: values.bass, treble: values.treble };
      input.connect(mid);
      const graph = createEffectGraph(ctx, mid, mapped, pan || output, useAnalyser);
      if (pan) {
        pan.pan.value = values.stereo;
        pan.connect(output);
      }
      return { ...graph, mid, pan };
    }

    function applyAdvancedControls() {
      const nodes = nodesRef.current;
      const ctx = audioCtxRef.current;
      if (!nodes || !ctx) return;
      nodes.master.gain.setTargetAtTime(controlsRef.current.volume, ctx.currentTime, 0.02);
      nodes.bass.gain.setTargetAtTime(controlsRef.current.bass, ctx.currentTime, 0.02);
      nodes.treble.gain.setTargetAtTime(controlsRef.current.treble, ctx.currentTime, 0.02);
      nodes.mid.gain.setTargetAtTime(controlsRef.current.eqMid, ctx.currentTime, 0.02);
      nodes.lowPass.frequency.setTargetAtTime(controlsRef.current.lowPass, ctx.currentTime, 0.02);
      nodes.highPass.frequency.setTargetAtTime(controlsRef.current.highPass, ctx.currentTime, 0.02);
      nodes.echoGain.gain.setTargetAtTime(controlsRef.current.echo, ctx.currentTime, 0.02);
      nodes.feedback.gain.setTargetAtTime(Math.min(0.72, controlsRef.current.echo * 0.62), ctx.currentTime, 0.02);
      nodes.reverbGain.gain.setTargetAtTime(controlsRef.current.reverb, ctx.currentTime, 0.02);
      if (nodes.pan) nodes.pan.pan.setTargetAtTime(controlsRef.current.stereo, ctx.currentTime, 0.02);
      sourcesRef.current.forEach(item => {
        const clip = item.clip || {};
        item.source.playbackRate.setTargetAtTime(Math.max(0.25, controlsRef.current.speed * (clip.speed || 1)), ctx.currentTime, 0.02);
        item.source.detune.setTargetAtTime(controlsRef.current.pitch + (clip.pitch || 0) + getVoicePresetSettings(clip).detune, ctx.currentTime, 0.02);
      });
    }

    function getVoicePresetSettings(clip) {
      if (!clip || clip.type !== 'voice') return VOICE_CHANGER_PRESETS.none;
      return VOICE_CHANGER_PRESETS[clip.voicePreset] || VOICE_CHANGER_PRESETS.none;
    }

    function buildClipFxChain(ctx, clip, input, output) {
      const preset = getVoicePresetSettings(clip);
      const highPass = ctx.createBiquadFilter();
      highPass.type = 'highpass';
      highPass.frequency.value = preset.highPass;

      const lowPass = ctx.createBiquadFilter();
      lowPass.type = 'lowpass';
      lowPass.frequency.value = preset.lowPass;

      const shape = ctx.createWaveShaper();
      shape.curve = createDistortionCurve(preset.distortion);
      shape.oversample = '2x';

      const presetGain = ctx.createGain();
      presetGain.gain.value = preset.gain;

      input.connect(highPass);
      highPass.connect(lowPass);
      lowPass.connect(shape);
      shape.connect(presetGain);
      presetGain.connect(output);

      return { highPass, lowPass, shape, presetGain, preset };
    }

    function scheduleClip(ctx, clip, playhead, destination, totalLength = projectLength) {
      if (clip.muted) return null;
      const buffer = buffersRef.current[clip.bufferId];
      if (!buffer) return null;
      const clipEnd = clip.start + clip.duration;
      if (!clip.loop && playhead >= clipEnd) return null;
      const source = ctx.createBufferSource();
      const gain = ctx.createGain();
      const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      const preset = getVoicePresetSettings(clip);
      const clipRate = Math.max(0.25, controlsRef.current.speed * (clip.speed || 1));
      const clipDetune = controlsRef.current.pitch + (clip.pitch || 0) + preset.detune;
      source.buffer = buffer;
      source.playbackRate.value = clipRate;
      source.detune.value = clipDetune;
      source.loop = clip.loop;
      source.loopStart = clip.offset;
      source.loopEnd = Math.min(buffer.duration, clip.offset + clip.duration);
      gain.gain.value = clip.volume;
      if (pan) pan.pan.value = clip.pan;
      source.connect(gain);
      const fxInput = pan || gain;
      if (pan) gain.connect(pan);
      const fx = buildClipFxChain(ctx, clip, fxInput, destination);

      const when = ctx.currentTime + Math.max(0, clip.start - playhead);
      const playedIntoClip = Math.max(0, playhead - clip.start);
      const offset = clip.loop ? clip.offset + (playedIntoClip % clip.duration) : clip.offset + playedIntoClip;
      const availableSource = clip.loop ? totalLength : Math.max(0.01, clip.duration - playedIntoClip);
      const sourceDuration = Math.max(0.01, Math.min(totalLength - Math.max(playhead, clip.start), availableSource));
      const outputDuration = clip.loop ? Math.max(0.05, totalLength - Math.max(playhead, clip.start)) : Math.max(0.05, sourceDuration / clipRate);
      gain.gain.setValueAtTime(clip.volume, when);
      if (clip.fadeIn > 0 && playedIntoClip < clip.fadeIn) {
        const startGain = clip.volume * (playedIntoClip / clip.fadeIn);
        gain.gain.setValueAtTime(startGain, when);
        gain.gain.linearRampToValueAtTime(clip.volume, when + Math.max(0.01, (clip.fadeIn - playedIntoClip) / clipRate));
      }
      if (clip.fadeOut > 0 && !clip.loop) {
        const fadeStart = when + Math.max(0, outputDuration - (clip.fadeOut / clipRate));
        gain.gain.setValueAtTime(clip.volume, fadeStart);
        gain.gain.linearRampToValueAtTime(0.0001, when + outputDuration);
      }
      source.start(when, Math.min(offset, Math.max(0, buffer.duration - 0.01)));
      source.stop(when + outputDuration);
      return { source, clip, fx };
    }

    async function playAdvanced() {
      if (!clips.length) {
        setStatus('Upload a client voice or import music before previewing the mix.');
        return;
      }
      window.pauseSiteMusic?.();
      const ctx = getAudioContext();
      await ctx.resume();
      stopAdvancedPlayback(false);
      const mix = ctx.createGain();
      nodesRef.current = createAdvancedMaster(ctx, mix, ctx.destination, controlsRef.current, true);
      sourcesRef.current = clips.map(clip => scheduleClip(ctx, clip, playheadRef.current, mix)).filter(Boolean);
      startedAtRef.current = ctx.currentTime;
      setIsPlaying(true);
      setStatus('Live preview running. Move knobs and sliders in real-time.');
      tickTimeline();
      drawAdvancedVisualizer();
    }

    function setAdvancedPlayhead(nextTime) {
      const next = Math.min(Math.max(0, projectLength - 0.01), Math.max(0, Number(nextTime) || 0));
      playheadRef.current = next;
      setCurrentTime(next);
      drawTimeline(next);
      return next;
    }

    async function seekAdvanced(nextTime, resumePlayback = isPlaying) {
      const next = setAdvancedPlayhead(nextTime);
      if (resumePlayback) {
        await playAdvanced();
        setStatus(`Preview moved to ${formatStudioTime(next)}.`);
      } else {
        setStatus(`Playhead set to ${formatStudioTime(next)}. Press Play to preview.`);
      }
    }

    function beginScrub() {
      scrubWasPlayingRef.current = isPlaying;
      if (isPlaying) stopAdvancedPlayback(false);
    }

    function scrubTo(nextTime) {
      setAdvancedPlayhead(nextTime);
    }

    function finishScrub() {
      if (scrubWasPlayingRef.current) {
        scrubWasPlayingRef.current = false;
        playAdvanced();
        setStatus(`Preview resumed from ${formatStudioTime(playheadRef.current)}.`);
      } else {
        setStatus(`Playhead set to ${formatStudioTime(playheadRef.current)}. Press Play to preview.`);
      }
    }

    function stopAdvancedPlayback(reset = true) {
      sourcesRef.current.forEach(item => { try { item.source.stop(0); } catch (e) {} });
      sourcesRef.current = [];
      nodesRef.current = null;
      cancelAnimationFrame(rafRef.current);
      cancelAnimationFrame(visualRafRef.current);
      setIsPlaying(false);
      if (reset) {
        playheadRef.current = 0;
        setCurrentTime(0);
      }
      drawVisualizerIdle();
    }

    function pauseAdvanced() {
      if (!isPlaying || !audioCtxRef.current) return;
      playheadRef.current = Math.min(projectLength, playheadRef.current + (audioCtxRef.current.currentTime - startedAtRef.current) * controlsRef.current.speed);
      stopAdvancedPlayback(false);
      setCurrentTime(playheadRef.current);
      setStatus('Preview paused.');
    }

    function getTimelineMetrics() {
      const canvas = timelineRef.current;
      if (!canvas) return null;
      const rect = canvas.getBoundingClientRect();
      return {
        canvas,
        rect,
        width: rect.width || canvas.clientWidth || 900,
        height: rect.height || canvas.clientHeight || 280,
        rowH: 48,
        topPadding: 42,
        handlePx: window.innerWidth <= 768 ? 26 : 18,
        length: Math.max(1, projectLength)
      };
    }

    function getTimelineClipHit(event) {
      const metrics = getTimelineMetrics();
      if (!metrics) return null;
      const x = Math.max(0, Math.min(metrics.width, event.clientX - metrics.rect.left));
      const y = event.clientY - metrics.rect.top;
      const time = (x / metrics.width) * metrics.length;
      if (y <= metrics.topPadding) return { metrics, x, y, index: -1, clip: null, mode: 'scrub', time };
      const index = Math.floor((y - metrics.topPadding) / metrics.rowH);
      const clip = clips[index];
      if (!clip) return { metrics, x, y, index, clip: null, mode: 'scrub', time };
      const clipX = (clip.start / metrics.length) * metrics.width;
      const clipDurationOnTimeline = Math.max(0.05, getClipTimelineEnd(clip) - clip.start);
      const clipW = Math.max(18, (clipDurationOnTimeline / metrics.length) * metrics.width);
      const clipY = metrics.topPadding + index * metrics.rowH;
      const clipH = metrics.rowH - 8;
      const inside = x >= clipX && x <= clipX + clipW && y >= clipY && y <= clipY + clipH;
      if (!inside) return { metrics, x, y, index, clip: null, mode: 'scrub', time };
      let mode = 'move';
      if (x - clipX <= metrics.handlePx) mode = 'trim-left';
      else if (clipX + clipW - x <= metrics.handlePx) mode = 'trim-right';
      return { metrics, x, y, index, clip, mode, time };
    }

    function updateTimelineHover(event) {
      if (dragStateRef.current) return;
      const hit = getTimelineClipHit(event);
      hoverStateRef.current = hit;
      const nextCursor = !hit || !hit.clip
        ? 'ew-resize'
        : hit.mode === 'move'
          ? 'grab'
          : 'ew-resize';
      setTimelineCursor(nextCursor);
    }

    function beginTimelineDrag(event) {
      const hit = getTimelineClipHit(event);
      if (!hit) return;
      if (!hit.clip) {
        scrubWasPlayingRef.current = isPlaying;
        if (isPlaying) stopAdvancedPlayback(false);
        dragStateRef.current = { mode: 'scrub', changed: false };
        scrubTo(hit.time);
        setTimelineCursor('ew-resize');
        event.preventDefault();
        return;
      }
      if (timelineTool === 'cut') {
        setSelectedId(hit.clip.id);
        setAdvancedPlayhead(hit.time);
        const splitAt = hit.time - hit.clip.start;
        if (splitAt > 0.05 && splitAt < hit.clip.duration - 0.05) {
          const first = { ...hit.clip, duration: splitAt };
          const second = {
            ...hit.clip,
            id: `clip_${Date.now()}_cut`,
            bufferId: `clip_${Date.now()}_cut_buffer`,
            start: hit.time,
            offset: hit.clip.offset + splitAt,
            duration: hit.clip.duration - splitAt
          };
          buffersRef.current[second.bufferId] = buffersRef.current[hit.clip.bufferId];
          commit(clips.map(clip => clip.id === hit.clip.id ? first : clip).concat(second), second.id);
          setStatus('Clip cut exactly where you clicked.');
        } else {
          setStatus('Click closer to the middle of a clip to cut it.');
        }
        event.preventDefault();
        return;
      }
      const buffer = buffersRef.current[hit.clip.bufferId];
      dragStateRef.current = {
        id: hit.clip.id,
        mode: hit.mode,
        initialClips: clips.map(clip => ({ ...clip })),
        initialSelectedId: selectedId,
        initialClip: { ...hit.clip },
        initialPointerTime: hit.time,
        maxDuration: buffer ? buffer.duration : hit.clip.duration,
        changed: false
      };
      setSelectedId(hit.clip.id);
      setTimelineCursor(hit.mode === 'move' ? 'grabbing' : 'ew-resize');
      event.preventDefault();
    }

    function handleTimelineDragMove(event) {
      const drag = dragStateRef.current;
      if (!drag) return;
      const metrics = getTimelineMetrics();
      if (!metrics) return;
      const x = Math.max(0, Math.min(metrics.width, event.clientX - metrics.rect.left));
      const pointerTime = (x / metrics.width) * metrics.length;
      if (drag.mode === 'scrub') {
        drag.changed = true;
        scrubTo(pointerTime);
        return;
      }
      const delta = pointerTime - drag.initialPointerTime;
      const minDuration = 0.05;
      const next = drag.initialClips.map(clip => {
        if (clip.id !== drag.id) return clip;
        if (drag.mode === 'move') {
          return { ...clip, start: Math.max(0, drag.initialClip.start + delta) };
        }
        if (drag.mode === 'trim-left') {
          const maxStart = drag.initialClip.start + drag.initialClip.duration - minDuration;
          const nextStart = Math.min(maxStart, Math.max(0, drag.initialClip.start + delta));
          const consumed = nextStart - drag.initialClip.start;
          const nextDuration = Math.max(minDuration, drag.initialClip.duration - consumed);
          return {
            ...clip,
            start: nextStart,
            offset: Math.max(0, drag.initialClip.offset + consumed),
            duration: Math.min(drag.maxDuration, nextDuration)
          };
        }
        const unclampedDuration = drag.initialClip.duration + delta;
        const maxAvailable = Math.max(minDuration, drag.maxDuration - drag.initialClip.offset);
        const nextDuration = Math.max(minDuration, Math.min(maxAvailable, unclampedDuration));
        return { ...clip, duration: nextDuration };
      });
      drag.changed = true;
      setClips(next);
    }

    function finishTimelineDrag() {
      const drag = dragStateRef.current;
      if (!drag) return;
      if (drag.mode === 'scrub') {
        dragStateRef.current = null;
        finishScrub();
        setTimelineCursor('ew-resize');
        return;
      }
      const finalClips = clips;
      const changed = drag.changed && JSON.stringify(snapshotForClips(finalClips, drag.id).clips) !== JSON.stringify(snapshotForClips(drag.initialClips, drag.initialSelectedId).clips);
      if (changed) {
        historyRef.current.push(snapshotForClips(drag.initialClips, drag.initialSelectedId));
        futureRef.current = [];
        setSelectedId(drag.id);
        setStatus(drag.mode === 'move' ? 'Clip moved on the timeline.' : 'Clip edge trimmed directly on the timeline.');
      }
      dragStateRef.current = null;
      setTimelineCursor('crosshair');
    }

    function tickTimeline() {
      const tick = () => {
        if (!audioCtxRef.current) return;
        const next = Math.min(projectLength, playheadRef.current + (audioCtxRef.current.currentTime - startedAtRef.current) * controlsRef.current.speed);
        setCurrentTime(next);
        drawTimeline(next);
        if (next >= projectLength - 0.02) stopAdvancedPlayback();
        else rafRef.current = requestAnimationFrame(tick);
      };
      tick();
    }

    function drawTimeline(marker = currentTime) {
      const canvas = timelineRef.current;
      if (!canvas) return;
      const dpr = window.devicePixelRatio || 1;
      const width = canvas.clientWidth || 900;
      const height = canvas.clientHeight || 280;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = 'rgba(2,4,8,0.84)';
      ctx.fillRect(0, 0, width, height);
      const length = Math.max(1, projectLength);
      const rowH = 48;
      const topPadding = 42;
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '700 10px Rajdhani, sans-serif';
      for (let i = 0; i <= 6; i++) {
        const markerTime = (i / 6) * length;
        const markerX = (i / 6) * width;
        ctx.fillText(formatStudioTime(markerTime), Math.min(width - 34, markerX + 5), 15);
        ctx.strokeStyle = 'rgba(255,255,255,0.14)';
        ctx.beginPath(); ctx.moveTo(markerX, 22); ctx.lineTo(markerX, 33); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(0,240,255,0.16)';
      ctx.beginPath(); ctx.moveTo(0, topPadding - 5); ctx.lineTo(width, topPadding - 5); ctx.stroke();
      for (let i = 0; i < 12; i++) {
        const x = (i / 12) * width;
        ctx.strokeStyle = i % 3 === 0 ? 'rgba(0,240,255,0.1)' : 'rgba(255,255,255,0.04)';
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
      }
      clips.forEach((clip, index) => {
        const y = topPadding + index * rowH;
        const x = (clip.start / length) * width;
        const clipDurationOnTimeline = Math.max(0.05, getClipTimelineEnd(clip) - clip.start);
        const w = Math.max(8, (clipDurationOnTimeline / length) * width);
        const h = rowH - 8;
        ctx.fillStyle = clip.id === selectedId
          ? 'rgba(0,240,255,0.2)'
          : clip.type === 'effect'
            ? 'rgba(37,211,102,0.14)'
            : clip.type === 'voice'
              ? 'rgba(255,196,87,0.16)'
              : 'rgba(0,136,255,0.15)';
        ctx.strokeStyle = clip.id === selectedId ? 'rgba(0,240,255,0.65)' : 'rgba(255,255,255,0.14)';
        ctx.beginPath(); ctx.rect(x, y, Math.min(w, width - x), h); ctx.fill(); ctx.stroke();
        const buffer = buffersRef.current[clip.bufferId];
        if (buffer) {
          const data = buffer.getChannelData(0);
          ctx.strokeStyle = clip.type === 'effect' ? '#25d366' : clip.type === 'voice' ? '#ffc457' : '#00f0ff';
          ctx.beginPath();
          const bars = Math.max(12, Math.floor(w / 4));
          for (let b = 0; b < bars; b++) {
            const sample = Math.abs(data[Math.floor((b / bars) * data.length)] || 0);
            const bx = x + (b / bars) * w;
            ctx.moveTo(bx, y + rowH / 2 - sample * 14);
            ctx.lineTo(bx, y + rowH / 2 + sample * 14);
          }
          ctx.stroke();
        }
        ctx.fillStyle = '#fff';
        ctx.font = '700 11px Rajdhani, sans-serif';
        ctx.fillText(clip.name.slice(0, 32), x + 8, y + 14);
        if (clip.id === selectedId) {
          ctx.fillStyle = 'rgba(255,255,255,0.88)';
          ctx.fillRect(x, y, 4, h);
          ctx.fillRect(Math.max(x, x + w - 4), y, 4, h);
        }
      });
      const markerX = (marker / length) * width;
      ctx.strokeStyle = 'rgba(255,255,255,0.86)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(markerX, 0); ctx.lineTo(markerX, height); ctx.stroke();
      ctx.fillStyle = '#00f0ff';
      ctx.beginPath(); ctx.arc(markerX, 29, 8, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 1;
    }

    function drawVisualizerIdle() {
      const canvas = visualizerRef.current;
      if (!canvas) return;
      const dpr = window.devicePixelRatio || 1;
      const width = canvas.clientWidth || 360;
      const height = canvas.clientHeight || 120;
      canvas.width = width * dpr; canvas.height = height * dpr;
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = 'rgba(2,4,8,0.78)';
      ctx.fillRect(0, 0, width, height);
    }

    function drawAdvancedVisualizer() {
      const analyser = nodesRef.current?.analyser;
      const canvas = visualizerRef.current;
      if (!analyser || !canvas) return;
      const data = new Uint8Array(analyser.frequencyBinCount);
      const render = () => {
        if (!nodesRef.current?.analyser) return;
        const width = canvas.clientWidth || 360;
        const height = canvas.clientHeight || 120;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr; canvas.height = height * dpr;
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        analyser.getByteFrequencyData(data);
        ctx.fillStyle = 'rgba(2,4,8,0.72)';
        ctx.fillRect(0, 0, width, height);
        for (let i = 0; i < 46; i++) {
          const value = data[Math.floor(i / 46 * data.length)] / 255;
          ctx.fillStyle = i % 3 === 0 ? '#25d366' : '#00f0ff';
          ctx.fillRect(i * (width / 46), height - value * height, width / 60, Math.max(3, value * height));
        }
        visualRafRef.current = requestAnimationFrame(render);
      };
      render();
    }

    function getExportEndTime() {
      const audibleEnds = clips
        .filter(clip => !clip.muted)
        .map(clip => getClipTimelineEnd(clip, controlsRef.current));
      return Math.max(0.1, ...audibleEnds);
    }

    async function renderAdvancedMixBuffer() {
      const sampleRate = 44100;
      const exportEnd = getExportEndTime();
      const renderEnd = exportEnd + 2.5;
      const length = Math.ceil(renderEnd * sampleRate);
      const OfflineCtor = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const offline = new OfflineCtor(2, length, sampleRate);
      const mix = offline.createGain();
      createAdvancedMaster(offline, mix, offline.destination, controlsRef.current, false);
      clips.forEach(clip => {
        if (clip.muted) return;
        const buffer = buffersRef.current[clip.bufferId];
        if (!buffer) return;

        const preset = getVoicePresetSettings(clip);
        const source = offline.createBufferSource();
        const gain = offline.createGain();
        const pan = offline.createStereoPanner ? offline.createStereoPanner() : null;
        const rate = Math.max(0.25, controlsRef.current.speed * (clip.speed || 1));
        const detune = controlsRef.current.pitch + (clip.pitch || 0) + preset.detune;
        const startTime = Math.max(0, clip.start);
        const available = Math.max(0.01, clip.duration);
        const outputDuration = clip.loop
          ? Math.max(0.05, renderEnd - startTime)
          : Math.max(0.05, Math.min(renderEnd - startTime, available / rate));

        if (startTime >= renderEnd || outputDuration <= 0) return;

        source.buffer = buffer;
        source.playbackRate.value = rate;
        source.detune.value = detune;
        source.loop = !!clip.loop;
        source.loopStart = Math.max(0, clip.offset || 0);
        source.loopEnd = Math.min(buffer.duration, (clip.offset || 0) + clip.duration);
        gain.gain.value = clip.volume;
        if (pan) pan.pan.value = clip.pan || 0;

        source.connect(gain);
        if (pan) {
          gain.connect(pan);
          buildClipFxChain(offline, clip, pan, mix);
        } else {
          buildClipFxChain(offline, clip, gain, mix);
        }

        gain.gain.setValueAtTime(0.0001, startTime);
        if (clip.fadeIn > 0) {
          gain.gain.linearRampToValueAtTime(clip.volume, startTime + Math.min(clip.fadeIn / rate, outputDuration));
        } else {
          gain.gain.setValueAtTime(clip.volume, startTime);
        }
        if (clip.fadeOut > 0 && !clip.loop) {
          const fadeStart = startTime + Math.max(0, outputDuration - (clip.fadeOut / rate));
          gain.gain.setValueAtTime(clip.volume, fadeStart);
          gain.gain.linearRampToValueAtTime(0.0001, startTime + outputDuration);
        }

        source.start(startTime, Math.min(clip.offset || 0, Math.max(0, buffer.duration - 0.01)));
        source.stop(startTime + outputDuration);
      });
      const rendered = await offline.startRendering();
      return trimAudioBufferSilence(rendered);
    }

    async function exportAdvanced(format) {
      if (!clips.length) return setStatus('Nothing to export yet.');
      const warnings = getRobloxUploadWarnings(clips);
      if (!licenseConfirmed) {
        setStatus('Centang konfirmasi lisensi dulu: upload ke Roblox hanya untuk audio original atau punya izin.');
        return;
      }
      if (warnings.length) {
        setStatus(`${warnings[0]} Export ditahan sampai nama/source audio kamu bersihkan.`);
        return;
      }
      let nativeOggCtx = null;
      try {
        setIsExporting(true);
        setReadyDownload(prev => {
          if (prev?.url) URL.revokeObjectURL(prev.url);
          return null;
        });
        if (format === 'ogg') {
          const AudioCtor = window.AudioContext || window.webkitAudioContext;
          if (AudioCtor) {
            nativeOggCtx = new AudioCtor({ sampleRate: 44100 });
            await nativeOggCtx.resume();
          }
        }
        setStatus(`Rendering ${format.toUpperCase()} Roblox upload file with preview-matched FX...`);
        const rendered = await renderAdvancedMixBuffer();
        const wavBlob = new Blob([audioBufferToWav(rendered)], { type: 'audio/wav' });
        if (format === 'mp3') {
          const mp3Blob = await audioBufferToMp3(rendered, setStatus);
          prepareDownload(mp3Blob, 'norsdev_roblox_ready_mix.mp3');
        } else if (format === 'ogg') {
          try {
            setStatus(`Encoding OGG. Keep this tab open for about ${formatStudioTime(rendered.duration)}.`);
            const oggBlob = await audioBufferToOggOpus(rendered, setStatus, nativeOggCtx);
            prepareDownload(oggBlob, 'norsdev_roblox_ready_mix.ogg');
          } catch (oggError) {
            setStatus(`OGG gagal (${oggError.message || 'encoder error'}). Membuat MP3 fallback untuk audio original/berlisensi...`);
            const mp3Blob = await audioBufferToMp3(rendered, setStatus);
            prepareDownload(mp3Blob, 'norsdev_roblox_ready_mix.mp3');
          }
        } else {
          prepareDownload(wavBlob, 'norsdev_roblox_ready_mix.wav');
        }
        setStatus(`${format.toUpperCase()} export siap untuk upload Roblox kalau audio sumber original/berlisensi. Kalau tidak auto-download, klik Download Ready.`);
      } catch (error) {
        setStatus(error.message || 'Export gagal.');
      } finally {
        if (nativeOggCtx) {
          try { nativeOggCtx.close?.(); } catch (error) {}
        }
        setIsExporting(false);
      }
    }

    function downloadBlob(blob, name) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function prepareDownload(blob, name) {
      const url = URL.createObjectURL(blob);
      setReadyDownload(prev => {
        if (prev?.url) URL.revokeObjectURL(prev.url);
        return { url, name };
      });
      const link = document.createElement('a');
      link.href = url;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

  <!-- ─── MODAL + AUDIO SCRIPTS ──────────────────────────── -->
  <script>
  function openVideoModal(link) {
    if (!link || link === '#') return;
    const modal = document.getElementById('video-modal');
    const iframe = document.getElementById('modal-iframe');
    if (!modal || !iframe) return;
    // Convert YouTube watch URL to embed URL
    let embedUrl = link;
    if (link.includes('youtube.com/watch?v=')) {
      const vid = link.split('v=')[1].split('&')[0];
      embedUrl = `https://www.youtube.com/embed/${vid}?autoplay=1`;
    } else if (link.includes('youtu.be/')) {
      const vid = link.split('youtu.be/')[1].split('?')[0];
      embedUrl = `https://www.youtube.com/embed/${vid}?autoplay=1`;
    } else if (!link.includes('embed')) {
      embedUrl = link;
    }
    iframe.src = embedUrl;
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(e) {
    if (e && e.target !== e.currentTarget) return;
    const modal = document.getElementById('video-modal');
    const iframe = document.getElementById('modal-iframe');
    if (!modal || !iframe) return;
    modal.classList.remove('open');
    iframe.src = '';
    document.body.style.overflow = '';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // Audio toggle — uses NORSDEV_CONFIG.musicUrl
  let audioOn = false;
  const audioBtn = document.getElementById('audio-btn');
  const audioIcon = document.getElementById('audio-icon');
  const bgMusic = new Audio();
  let autoplayPending = false;

  function initMedia() {
    // Set hero background video from config
    const heroVideoSrc = document.getElementById('hero-video-src');
    if (heroVideoSrc && window.NORSDEV_CONFIG.heroVideo) {
      heroVideoSrc.src = window.NORSDEV_CONFIG.heroVideo;
      const heroVideo = document.getElementById('hero-video');
      heroVideo.load();
    }

    // Set background music from config
    if (window.NORSDEV_CONFIG.musicUrl) {
      bgMusic.src = window.NORSDEV_CONFIG.musicUrl;
      bgMusic.autoplay = true;
      bgMusic.loop = true;
      bgMusic.muted = false;
      bgMusic.preload = 'auto';
      bgMusic.volume = 0.75;
      bgMusic.load();
    }
  }

  function syncAudioButton() {
    audioIcon.className = audioOn ? 'fas fa-volume-up' : 'fas fa-volume-mute';
    audioBtn.setAttribute('title', audioOn ? 'Mute music' : 'Play music');
    audioBtn.setAttribute('aria-label', audioOn ? 'Mute background music' : 'Play background music');
  }

  function playBackgroundMusic() {
    if (!bgMusic.src) return Promise.resolve();
    bgMusic.muted = false;
    bgMusic.volume = 0.75;
    return bgMusic.play().then(() => {
      audioOn = true;
      autoplayPending = false;
      syncAudioButton();
    }).catch(() => {
      audioOn = false;
      autoplayPending = true;
      syncAudioButton();
    });
  }

  function pauseBackgroundMusic() {
    bgMusic.pause();
    audioOn = false;
    autoplayPending = false;
    syncAudioButton();
  }

  function startMusicAfterLoading() {
    playBackgroundMusic();
  }

  audioBtn.addEventListener('click', () => {
    if (audioOn) {
      pauseBackgroundMusic();
    } else {
      playBackgroundMusic();
    }
  });

  document.addEventListener('pointerdown', () => {
    if (autoplayPending && !audioOn) {
      playBackgroundMusic();
    }
  }, { once: true });

  // Init hero video + music from config
  initMedia();
  syncAudioButton();
  window.pauseSiteMusic = pauseBackgroundMusic;
  </script>

  <script>
  const ffmpegState = { instance: null, loaded: false, loading: null };
  async function loadNorsdevFfmpeg(onStatus) {
    if (ffmpegState.loaded) return ffmpegState.instance;
    if (ffmpegState.loading) return ffmpegState.loading;
    ffmpegState.loading = (async () => {
      onStatus?.('Loading FFmpeg WebAssembly encoder...');
      const [{ FFmpeg }, { toBlobURL }] = await Promise.all([
        import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/index.js'),
        import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js')
      ]);
      const ffmpeg = new FFmpeg();
      const baseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd';
      ffmpeg.on('log', ({ message }) => {
        if (message) onStatus?.(`FFmpeg: ${message}`);
      });
      await ffmpeg.load({
        coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
        wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm')
      });
      ffmpegState.instance = ffmpeg;
      ffmpegState.loaded = true;
      onStatus?.('FFmpeg encoder ready.');
      return ffmpeg;
    })();
    return ffmpegState.loading;
  }

  window.NORSDEV_FFMPEG = {
    async encodeMp3(wavBlob, onStatus) {
      const { fetchFile } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js');
      const ffmpeg = await loadNorsdevFfmpeg(onStatus);
      await ffmpeg.writeFile('input.wav', await fetchFile(wavBlob));
      await ffmpeg.exec(['-y', '-i', 'input.wav', '-vn', '-map_metadata', '-1', '-ar', '44100', '-ac', '2', '-codec:a', 'libmp3lame', '-b:a', '192k', 'output.mp3']);
      const data = await ffmpeg.readFile('output.mp3');
      return new Blob([data.buffer], { type: 'audio/mpeg' });
    },
    async encodeOgg(wavBlob, onStatus) {
      const { fetchFile } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js');
      const ffmpeg = await loadNorsdevFfmpeg(onStatus);
      await ffmpeg.writeFile('input.wav', await fetchFile(wavBlob));
      await ffmpeg.exec(['-y', '-i', 'input.wav', '-vn', '-map_metadata', '-1', '-ar', '44100', '-ac', '2', '-codec:a', 'libvorbis', '-q:a', '5', 'output.ogg']);
      const data = await ffmpeg.readFile('output.ogg');
      return new Blob([data.buffer], { type: 'audio/ogg' });
    }
  };
  </script>
