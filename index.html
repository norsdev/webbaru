  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan: #00f0ff;
      --blue: #0044ff;
      --purple: #7b2fff;
      --dark: #020408;
      --dark2: #050a14;
      --glass: rgba(255,255,255,0.04);
      --glass2: rgba(255,255,255,0.025);
      --border: rgba(0,240,255,0.1);
      --text: #e8e8e8;
      --text-dim: rgba(255,255,255,0.45);
      --discord: #5865f2;
      --wa: #25d366;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
      cursor: default;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--dark); }
    ::-webkit-scrollbar-thumb { background: rgba(0,240,255,0.2); border-radius: 4px; }

    /* ─── LAYERS ───────────────────────────────────────── */
    #bg-canvas  { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .grid-layer { position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background-image: linear-gradient(rgba(0,240,255,0.018) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0,240,255,0.018) 1px, transparent 1px);
      background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(ellipse 90% 90% at 50% 50%, black 20%, transparent 70%);
    mask-image: radial-gradient(ellipse 90% 90% at 50% 50%, black 20%, transparent 70%);
    }
    .vignette   { position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 25%, rgba(2,4,8,0.9) 100%);
    }
    .scanline   { position: fixed; left: 0; width: 100%; height: 1px; z-index: 3;
      background: linear-gradient(90deg, transparent, rgba(0,240,255,0.06), transparent);
      pointer-events: none; animation: scanMove 9s linear infinite;
    }
    @keyframes scanMove { 0% { top: -1px; } 100% { top: 100%; } }

    /* ─── APP ROOT ────────────────────────────────────── */
    #root { position: relative; z-index: 5; }

    /* ─── GLASS CARD ──────────────────────────────────── */
    .glass {
      background: var(--glass);
    -webkit-backdrop-filter: blur(24px);
    backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
    }
    .glass::before {
      content: ''; position: absolute; inset: -1px;
      background: linear-gradient(135deg, rgba(0,240,255,0.07) 0%, transparent 45%, rgba(123,47,255,0.06) 100%);
      border-radius: 20px; pointer-events: none; z-index: -1;
    }
    .glass::after {
      content: ''; position: absolute; top: -1px; left: 12%; right: 12%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,240,255,0.5), transparent);
      border-radius: 20px 20px 0 0;
    }

    /* ─── GLOW BUTTONS ─────────────────────────────────── */
    .btn-primary {
      display: inline-flex; align-items: center; gap: 0.6rem;
      font-family: 'Rajdhani', sans-serif; font-size: 0.82rem; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase;
      padding: 0.85rem 2.2rem; border-radius: 60px;
      border: none; cursor: pointer; text-decoration: none;
      transition: all 0.4s cubic-bezier(0.23,1,0.32,1);
      position: relative; overflow: hidden;
    }
    .btn-primary.cyan {
      background: linear-gradient(135deg, var(--cyan), #0088ff);
      color: var(--dark); box-shadow: 0 0 20px rgba(0,240,255,0.3);
    }
    .btn-primary.cyan:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 0 40px rgba(0,240,255,0.45), 0 0 80px rgba(0,68,255,0.2);
    }
    .btn-primary.glass-btn {
      background: rgba(0,240,255,0.06);
      color: var(--cyan);
      border: 1px solid rgba(0,240,255,0.2);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    }
    .btn-primary.glass-btn:hover {
      background: rgba(0,240,255,0.12);
      border-color: rgba(0,240,255,0.4);
      transform: translateY(-3px);
      box-shadow: 0 0 25px rgba(0,240,255,0.2);
    }
    .btn-primary.discord-btn {
      background: rgba(88,101,242,0.1); color: var(--discord);
      border: 1px solid rgba(88,101,242,0.3);
    }
    .btn-primary.discord-btn:hover {
      background: rgba(88,101,242,0.2);
      border-color: rgba(88,101,242,0.6);
      transform: translateY(-3px);
      box-shadow: 0 0 30px rgba(88,101,242,0.3);
    }
    .btn-primary.wa-btn {
      background: rgba(37,211,102,0.1); color: var(--wa);
      border: 1px solid rgba(37,211,102,0.3);
    }
    .btn-primary.wa-btn:hover {
      background: rgba(37,211,102,0.2);
      border-color: rgba(37,211,102,0.6);
      transform: translateY(-3px);
      box-shadow: 0 0 30px rgba(37,211,102,0.3);
    }

    /* ─── SECTION BASE ──────────────────────────────────── */
    .section { min-height: 100vh; padding: 5rem 2rem; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    /* ─── SECTION LABEL ─────────────────────────────────── */
    .section-label {
      font-family: 'Rajdhani', sans-serif; font-size: 0.7rem; letter-spacing: 0.5em;
      text-transform: uppercase; color: var(--cyan); opacity: 0.5;
      margin-bottom: 0.5rem; text-align: center;
    }

    /* ─── SECTION HEADING ───────────────────────────────── */
    .section-heading {
      font-family: 'Orbitron', monospace; font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      text-align: center; line-height: 1.15; margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #fff 0%, var(--cyan) 60%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .section-desc {
      font-family: 'Rajdhani', sans-serif; font-size: 1rem;
      color: var(--text-dim); text-align: center; max-width: 580px;
      line-height: 1.6; letter-spacing: 0.02em;
    }

    /* ─── DIVIDER LINE ──────────────────────────────────── */
    .divider {
      width: 60px; height: 2px;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      border-radius: 2px; margin: 1rem auto;
      box-shadow: 0 0 10px rgba(0,240,255,0.4);
    }

    /* ─── GLOW ORB ──────────────────────────────────────── */
    .orb {
      position: absolute; border-radius: 50%; pointer-events: none;
      filter: blur(50px);
    }

    /* ─── CORNER DECOS ──────────────────────────────────── */
    .corner { position: fixed; z-index: 6; width: 36px; height: 36px; opacity: 0.2; }
    .corner-tl { top: 0.8rem; left: 0.8rem; border-top: 1px solid var(--cyan); border-left: 1px solid var(--cyan); }
    .corner-tr { top: 0.8rem; right: 0.8rem; border-top: 1px solid var(--cyan); border-right: 1px solid var(--cyan); }
    .corner-bl { bottom: 0.8rem; left: 0.8rem; border-bottom: 1px solid var(--cyan); border-left: 1px solid var(--cyan); }
    .corner-br { bottom: 0.8rem; right: 0.8rem; border-bottom: 1px solid var(--cyan); border-right: 1px solid var(--cyan); }

    /* ─── LOADING ───────────────────────────────────────── */
    #loading-screen {
      position: fixed; inset: 0; z-index: 9999;
      background:
        radial-gradient(circle at 50% 42%, rgba(123,47,255,0.24), transparent 34%),
        radial-gradient(circle at 50% 56%, rgba(0,240,255,0.16), transparent 40%),
        var(--dark);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 0.8s, visibility 0.8s;
    }
    #loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-stage {
      position: relative;
      width: min(72vw, 430px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin-bottom: 1.25rem;
      isolation: isolate;
    }
    .loader-stage::before,
    .loader-stage::after {
      content: '';
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      border: 1px solid rgba(0,240,255,0.18);
      box-shadow: 0 0 42px rgba(0,240,255,0.18), inset 0 0 28px rgba(123,47,255,0.12);
      animation: spin 8s linear infinite;
      z-index: -1;
    }
    .loader-stage::after {
      inset: 22%;
      border-color: rgba(123,47,255,0.24);
      animation-duration: 5.5s;
      animation-direction: reverse;
      transform: rotateX(68deg);
    }
    #loader-3d {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 0 32px rgba(0,240,255,0.32));
    }
    .loader-orbit {
      position: absolute;
      width: 72%;
      height: 72%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
      transform: rotateX(64deg);
      animation: loaderOrbit 3s linear infinite;
      pointer-events: none;
    }
    .loader-orbit::before {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      left: 50%;
      top: -5px;
      background: var(--cyan);
      box-shadow: 0 0 18px var(--cyan), 0 0 34px rgba(123,47,255,0.9);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes loaderOrbit { to { transform: rotateX(64deg) rotateZ(360deg); } }
    .loader-text {
      font-family: 'Orbitron', monospace; font-size: 0.65rem;
      letter-spacing: 0.6em; color: var(--cyan); opacity: 0.75;
      text-shadow: 0 0 18px rgba(0,240,255,0.45);
    }
    .loader-subtext {
      margin-top: 0.7rem;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }

    /* ─── NAV ───────────────────────────────────────────── */
    .nav-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 2.5rem;
      background: rgba(2,4,8,0.7);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0,240,255,0.06);
      transition: all 0.3s;
    }
    .nav-logo {
      font-family: 'Orbitron', monospace; font-size: 1rem; font-weight: 900;
      letter-spacing: 0.1em; text-transform: uppercase;
      background: linear-gradient(135deg, var(--cyan), #7b2fff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-link {
      font-family: 'Rajdhani', sans-serif; font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim);
      text-decoration: none; transition: color 0.3s; cursor: pointer;
    }
    .nav-link:hover { color: var(--cyan); }
    .nav-cta { display: flex; gap: 0.6rem; }

    /* ─── HERO ──────────────────────────────────────────── */
    #hero { min-height: 100vh; position: relative; overflow: hidden; }
    .hero-inner {
      position: relative; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 6rem 2rem 4rem; text-align: center;
    }
    .hero-glow-center {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 900px; height: 900px; border-radius: 50%;
      background: radial-gradient(circle, rgba(0,240,255,0.06) 0%, transparent 65%);
      filter: blur(80px); pointer-events: none;
    }
    .hero-glow-purple {
      position: absolute; top: -100px; right: -150px;
      width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(123,47,255,0.07) 0%, transparent 65%);
      filter: blur(80px); pointer-events: none;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-family: 'Rajdhani', sans-serif; font-size: 0.72rem;
      letter-spacing: 0.35em; text-transform: uppercase;
      color: var(--cyan); opacity: 0.7;
      padding: 0.4rem 1.2rem; border-radius: 30px;
      background: rgba(0,240,255,0.06);
      border: 1px solid rgba(0,240,255,0.15);
      margin-bottom: 1.5rem;
    }
    .hero-title {
      font-family: 'Orbitron', monospace;
      font-size: clamp(3.5rem, 10vw, 9rem);
      font-weight: 900; letter-spacing: 0.05em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff 0%, var(--cyan) 30%, var(--purple) 70%, #fff 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: gradientShift 5s ease infinite;
      line-height: 0.95;
      filter: drop-shadow(0 0 60px rgba(0,240,255,0.15));
      margin-bottom: 1rem;
    }
    @keyframes gradientShift {
      0%,100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .hero-subtitle {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.6rem);
      font-weight: 400; letter-spacing: 0.5em; text-transform: uppercase;
      color: rgba(0,240,255,0.7); margin-bottom: 1.5rem;
    }
    .hero-statement {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(0.9rem, 1.5vw, 1.05rem);
      color: var(--text-dim); max-width: 520px;
      line-height: 1.7; margin-bottom: 2.5rem;
    }
    .hero-tags {
      display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center;
      margin-bottom: 2.5rem;
    }
    .hero-tag {
      font-family: 'Rajdhani', sans-serif; font-size: 0.72rem;
      letter-spacing: 0.15em; padding: 0.35rem 1rem;
      border-radius: 30px;
      background: rgba(0,240,255,0.05);
      border: 1px solid rgba(0,240,255,0.1);
      color: rgba(0,240,255,0.5);
    }
    .hero-btns { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .scroll-indicator {
      position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
      opacity: 0.3; animation: scrollBounce 2s ease-in-out infinite;
    }
    .scroll-indicator span { font-family: 'Rajdhani', sans-serif; font-size: 0.6rem; letter-spacing: 0.4em; color: var(--cyan); text-transform: uppercase; }
    .scroll-line { width: 1px; height: 30px; background: linear-gradient(180deg, var(--cyan), transparent); }
    @keyframes scrollBounce { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(8px); } }

    /* ─── SERVICE CARDS ─────────────────────────────────── */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem; max-width: 1100px; width: 100%;
    }
    .service-card {
      border-radius: 20px; padding: 2rem;
      background: var(--glass2);
      border: 1px solid var(--border);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
      position: relative; overflow: hidden;
      transition: all 0.5s cubic-bezier(0.23,1,0.32,1);
      cursor: default;
    }
    .service-card::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(0,240,255,0.05) 0%, transparent 50%);
      opacity: 0; transition: opacity 0.5s;
    }
    .service-card:hover::before { opacity: 1; }
    .service-card:hover {
      border-color: rgba(0,240,255,0.25);
      transform: translateY(-8px);
      box-shadow: 0 20px 60px rgba(0,240,255,0.08), 0 0 40px rgba(0,240,255,0.04);
    }
    .service-icon {
      width: 56px; height: 56px; border-radius: 14px;
      background: linear-gradient(135deg, rgba(0,240,255,0.1), rgba(123,47,255,0.1));
      border: 1px solid rgba(0,240,255,0.15);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1.2rem; font-size: 1.4rem;
      transition: all 0.4s;
    }
    .service-card:hover .service-icon {
      box-shadow: 0 0 25px rgba(0,240,255,0.2);
      border-color: rgba(0,240,255,0.3);
    }
    .service-card h3 {
      font-family: 'Orbitron', monospace; font-size: 0.9rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: #fff; margin-bottom: 0.6rem;
    }
    .service-card p {
      font-family: 'Rajdhani', sans-serif; font-size: 0.9rem;
      color: var(--text-dim); line-height: 1.5;
    }
    .service-glow { position: absolute; top: -30px; right: -30px; width: 120px; height: 120px; border-radius: 50%; filter: blur(30px); pointer-events: none; opacity: 0.5; transition: opacity 0.5s; }
    .service-card:hover .service-glow { opacity: 1; }

    /* ─── MAP SHOWCASE ──────────────────────────────────── */
    .filter-tabs {
      display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center;
      margin-bottom: 2.5rem;
    }
    .filter-tab {
      font-family: 'Rajdhani', sans-serif; font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.2em; text-transform: uppercase;
      padding: 0.5rem 1.2rem; border-radius: 30px;
      background: transparent; border: 1px solid rgba(0,240,255,0.12);
      color: var(--text-dim); cursor: pointer; transition: all 0.3s;
    }
    .filter-tab:hover, .filter-tab.active {
      background: rgba(0,240,255,0.08);
      border-color: rgba(0,240,255,0.35);
      color: var(--cyan);
    }
    .filter-tab.active { box-shadow: 0 0 15px rgba(0,240,255,0.15); }

    .maps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem; max-width: 1200px; width: 100%;
    }
    .map-card {
      border-radius: 18px; overflow: hidden;
      background: var(--glass2); border: 1px solid var(--border);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      transition: all 0.5s cubic-bezier(0.23,1,0.32,1);
      position: relative;
    }
    .map-card:hover {
      border-color: rgba(0,240,255,0.25);
      transform: translateY(-6px);
      box-shadow: 0 20px 60px rgba(0,240,255,0.1);
    }
    .map-thumb {
      width: 100%; height: 200px; position: relative; overflow: hidden;
    }
    .map-thumb img, .map-thumb .thumb-placeholder {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.6s;
    }
    .map-card:hover .map-thumb img,
    .map-card:hover .thumb-placeholder { transform: scale(1.06); }
    .thumb-placeholder {
      display: flex; align-items: center; justify-content: center;
      font-family: 'Orbitron', monospace; font-size: 2.5rem; font-weight: 900;
      background: linear-gradient(135deg, rgba(0,240,255,0.1), rgba(123,47,255,0.15));
      color: rgba(0,240,255,0.2);
    }
    .map-thumb-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 30%, rgba(2,4,8,0.8) 100%);
    }
    .map-tags {
      position: absolute; top: 0.8rem; left: 0.8rem;
      display: flex; gap: 0.4rem; flex-wrap: wrap;
    }
    .map-tag {
      font-family: 'Rajdhani', sans-serif; font-size: 0.62rem;
      letter-spacing: 0.12em; padding: 0.2rem 0.6rem;
      border-radius: 20px;
      background: rgba(0,240,255,0.15); color: var(--cyan);
      border: 1px solid rgba(0,240,255,0.2);
    }
    .map-tag.purple { background: rgba(123,47,255,0.15); color: #a87fff; border-color: rgba(123,47,255,0.2); }
    .map-tag.green  { background: rgba(37,211,102,0.12); color: var(--wa); border-color: rgba(37,211,102,0.2); }
    .map-body { padding: 1.2rem 1.4rem; }
    .map-body h3 { font-family: 'Orbitron', monospace; font-size: 0.82rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; margin-bottom: 0.4rem; }
    .map-body p { font-family: 'Rajdhani', sans-serif; font-size: 0.85rem; color: var(--text-dim); line-height: 1.4; margin-bottom: 1rem; }
    .map-actions { display: flex; gap: 0.6rem; }
    .map-btn {
      font-family: 'Rajdhani', sans-serif; font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.15em; text-transform: uppercase;
      padding: 0.45rem 1rem; border-radius: 8px;
      border: 1px solid; cursor: pointer;

  <script>
  (function() {
    const canvas = document.getElementById('bg-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.z = 22;

    // Stars
    const sg = new THREE.BufferGeometry();
    const N = 2500;
    const pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      pos[i*3]   = (Math.random()-.5)*110;
      pos[i*3+1] = (Math.random()-.5)*110;
      pos[i*3+2] = (Math.random()-.5)*110;
    }
    sg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const sm = new THREE.PointsMaterial({ color: 0x00f0ff, size: 0.07, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false });
    scene.add(new THREE.Points(sg, sm));

    // Nebula blobs
    const blobs = [];
    const bGeo = new THREE.SphereGeometry(1, 8, 8);
    const colors = [0x00f0ff, 0x7b2fff, 0x0044ff, 0x00ffaa];
    for (let i = 0; i < 5; i++) {
      const mat = new THREE.MeshBasicMaterial({ color: colors[i%4], transparent: true, opacity: 0.015, blending: THREE.AdditiveBlending, depthWrite: false });
      const m = new THREE.Mesh(bGeo, mat);
      m.position.set((Math.random()-.5)*40, (Math.random()-.5)*30, (Math.random()-.5)*20);
      m.scale.setScalar(6 + Math.random()*8);
      scene.add(m);
      blobs.push(m);
    }

    // Particles
    const pg = new THREE.BufferGeometry();
    const pn = 300;
    const pp = new Float32Array(pn*3);
    for (let i=0; i<pn; i++) {
      pp[i*3]   = (Math.random()-.5)*80;
      pp[i*3+1] = (Math.random()-.5)*60;
      pp[i*3+2] = (Math.random()-.5)*40;
    }
    pg.setAttribute('position', new THREE.BufferAttribute(pp,3));
    const pm = new THREE.PointsMaterial({ color: 0x7b2fff, size: 0.04, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false });
    scene.add(new THREE.Points(pg, pm));

    let mx=0, my=0, tx=0, ty=0;
    document.addEventListener('mousemove', e => {
      mx = (e.clientX/window.innerWidth-.5)*2;
      my = -(e.clientY/window.innerHeight-.5)*2;
    });

    let t = 0;
    function frame() {
      requestAnimationFrame(frame);
      t += 0.0015;
      tx += (mx-tx)*0.015; ty += (my-ty)*0.015;
      scene.rotation.y = tx*0.04;
      scene.rotation.x = ty*0.04;
      scene.rotation.z += 0.0002;
      blobs.forEach((b,i) => {
        b.position.y += Math.sin(t+i*1.5)*0.005;
        b.position.x += Math.cos(t*0.7+i)*0.003;
      });
      renderer.render(scene, camera);
    }
    frame();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  })();
  </script>

  <!-- ─── GSAP SCROLL REVEAL ──────────────────────────────── -->
  <script>
  (function() {
    const canvas = document.getElementById('loader-3d');
    const status = document.getElementById('loader-status');
    if (!canvas || !window.THREE) return;

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
    camera.position.set(0, 1.2, 8.5);

    const rig = new THREE.Group();
    scene.add(rig);

    const ambient = new THREE.AmbientLight(0x7bdfff, 0.9);
    const key = new THREE.PointLight(0x00f0ff, 3.1, 18);
    key.position.set(3, 4, 5);
    const rim = new THREE.PointLight(0x7b2fff, 2.6, 14);
    rim.position.set(-4, 1, -2);
    scene.add(ambient, key, rim);

    const cyanMat = new THREE.MeshStandardMaterial({
      color: 0x00f0ff,
      emissive: 0x004cff,
      emissiveIntensity: 0.48,
      metalness: 0.78,
      roughness: 0.26,
      side: THREE.DoubleSide
    });
    const violetMat = new THREE.MeshStandardMaterial({
      color: 0x8a4dff,
      emissive: 0x5b19ff,
      emissiveIntensity: 0.55,
      metalness: 0.82,
      roughness: 0.22,
      side: THREE.DoubleSide
    });
    const edgeMat = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.24,
      blending: THREE.AdditiveBlending
    });

    function fitCanvas() {
      const box = canvas.getBoundingClientRect();
      const size = Math.max(1, Math.floor(Math.min(box.width || 360, box.height || 360)));
      renderer.setSize(size, size, false);
      camera.aspect = 1;
      camera.updateProjectionMatrix();
    }

    function normalizeModel(model) {
      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);
      model.position.sub(center);
      const maxAxis = Math.max(size.x, size.y, size.z) || 1;
      model.scale.setScalar(4.4 / maxAxis);
      model.rotation.x = -Math.PI / 2;
      model.rotation.y = 0.05;
      model.rotation.z = 0.05;
    }

    function styleModel(model) {
      let meshIndex = 0;
      model.traverse(child => {
        if (!child.isMesh) return;
        child.material = meshIndex % 2 ? violetMat : cyanMat;
        child.frustumCulled = false;
        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(child.geometry, 28), edgeMat);
        edges.frustumCulled = false;
        child.add(edges);
        meshIndex += 1;
      });
      normalizeModel(model);
      rig.add(model);
      if (status) status.textContent = 'loading digital identity';
    }

    function fallbackModel() {
      const geo = new THREE.IcosahedronGeometry(2.15, 1);
      const mesh = new THREE.Mesh(geo, cyanMat);
      const wire = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat);
      mesh.add(wire);
      rig.add(mesh);
      if (status) status.textContent = 'loading fallback core';
    }

    function parseSimpleObj(text) {
      const vertices = [];
      const positions = [];
      text.split(/\r?\n/).forEach(line => {
        const parts = line.trim().split(/\s+/);
        if (parts[0] === 'v' && parts.length >= 4) {
          vertices.push([
            Number(parts[1]) || 0,
            Number(parts[2]) || 0,
            Number(parts[3]) || 0
          ]);
        } else if (parts[0] === 'f' && parts.length >= 4) {
          const face = parts.slice(1).map(token => {
            const index = Number(token.split('/')[0]);
            return vertices[index - 1];
          }).filter(Boolean);
          for (let i = 1; i < face.length - 1; i++) {
            [face[0], face[i], face[i + 1]].forEach(v => positions.push(v[0], v[1], v[2]));
          }
        }
      });

      if (!positions.length) throw new Error('OBJ has no faces.');
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, cyanMat);
      mesh.frustumCulled = false;
      const model = new THREE.Group();
      model.add(mesh);
      return model;
    }

    fitCanvas();
    window.addEventListener('resize', fitCanvas);

    if (window.NORSDEV_OBJ_TEXT) {
      try {
        styleModel(parseSimpleObj(window.NORSDEV_OBJ_TEXT));
      } catch (error) {
        fallbackModel();
      }
    } else if (window.THREE.OBJLoader) {
      const loader = new THREE.OBJLoader();
      try {
        loader.load(
          'assets/3d/NORSDEV.obj',
          styleModel,
          xhr => {
            if (status && xhr.total) {
              status.textContent = `loading model ${Math.round((xhr.loaded / xhr.total) * 100)}%`;
            }
          },
          fallbackModel
        );
      } catch (error) {
        fallbackModel();
      }
    } else {
      fallbackModel();
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      rig.rotation.y += 0.012;
      rig.rotation.x = Math.sin(t * 1.4) * 0.08;
      rig.position.y = Math.sin(t * 2.1) * 0.16;
      rig.scale.setScalar(1 + Math.sin(t * 3.4) * 0.025);
      key.intensity = 2.7 + Math.sin(t * 4) * 0.45;
      rim.position.x = Math.sin(t * 1.2) * 4;
      renderer.render(scene, camera);
    }
    animate();
  })();

  // ─── MAP CARD ───────────────────────────────────────────
  const DEFAULT_DJ_CONTROLS = {
    volume: 0.85,
    pitch: 0,
    speed: 1,
    bass: 0,
    treble: 0,
    reverb: 0,
    echo: 0,
    lowPass: 20000,
    highPass: 20
  };

  function formatStudioTime(seconds) {
    if (!Number.isFinite(seconds)) return '00:00';
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  }

  function createReverbImpulse(ctx, seconds = 2.2, decay = 2.6) {
    const length = Math.max(1, Math.floor(ctx.sampleRate * seconds));
    const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
    for (let channel = 0; channel < impulse.numberOfChannels; channel++) {
      const data = impulse.getChannelData(channel);
      for (let i = 0; i < length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
      }
    }
    return impulse;
  }

  function createEffectGraph(ctx, source, values, output, useAnalyser = false) {
    const bass = ctx.createBiquadFilter();
    bass.type = 'lowshelf';
    bass.frequency.value = 180;
    bass.gain.value = values.bass;

    const treble = ctx.createBiquadFilter();
    treble.type = 'highshelf';
    treble.frequency.value = 3400;
    treble.gain.value = values.treble;

    const lowPass = ctx.createBiquadFilter();
    lowPass.type = 'lowpass';
    lowPass.frequency.value = values.lowPass;
    lowPass.Q.value = 0.8;

    const highPass = ctx.createBiquadFilter();
    highPass.type = 'highpass';
    highPass.frequency.value = values.highPass;
    highPass.Q.value = 0.8;

    const mix = ctx.createGain();
    const master = ctx.createGain();
    master.gain.value = values.volume;

    const delay = ctx.createDelay(1);
    delay.delayTime.value = 0.28;
    const echoGain = ctx.createGain();
    echoGain.gain.value = values.echo;
    const feedback = ctx.createGain();
    feedback.gain.value = Math.min(0.72, values.echo * 0.62);

    const convolver = ctx.createConvolver();
    convolver.buffer = createReverbImpulse(ctx);
    const reverbGain = ctx.createGain();
    reverbGain.gain.value = values.reverb;

    source.connect(bass);
    bass.connect(treble);
    treble.connect(lowPass);
    lowPass.connect(highPass);

    highPass.connect(mix);
    highPass.connect(delay);
    delay.connect(feedback);
    feedback.connect(delay);
    delay.connect(echoGain);
    echoGain.connect(mix);

    highPass.connect(convolver);
    convolver.connect(reverbGain);
    reverbGain.connect(mix);

    let analyser = null;
    if (useAnalyser) {
      analyser = ctx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.82;
      mix.connect(analyser);
      analyser.connect(master);
    } else {
      mix.connect(master);
    }
    master.connect(output);

    return { bass, treble, lowPass, highPass, master, delay, echoGain, feedback, convolver, reverbGain, analyser };
  }

  function audioBufferToWav(buffer) {
    const channels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const length = buffer.length * channels * 2 + 44;
    const view = new DataView(new ArrayBuffer(length));
    const writeString = (offset, value) => {
      for (let i = 0; i < value.length; i++) view.setUint8(offset + i, value.charCodeAt(i));
    };

    writeString(0, 'RIFF');
    view.setUint32(4, length - 8, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, channels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * channels * 2, true);
    view.setUint16(32, channels * 2, true);
    view.setUint16(34, 16, true);
    writeString(36, 'data');
    view.setUint32(40, length - 44, true);

    const channelData = Array.from({ length: channels }, (_, i) => buffer.getChannelData(i));
    let offset = 44;
    for (let i = 0; i < buffer.length; i++) {
      for (let channel = 0; channel < channels; channel++) {
        const sample = Math.max(-1, Math.min(1, channelData[channel][i]));
        view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
        offset += 2;
      }
    }
    return view.buffer;
  }

  function trimAudioBufferSilence(buffer, threshold = 0.0008, tailPadSeconds = 0.08) {
    const channels = buffer.numberOfChannels;
    let lastAudibleFrame = -1;
    for (let channel = 0; channel < channels; channel++) {
      const data = buffer.getChannelData(channel);
      for (let i = data.length - 1; i >= 0; i--) {
        if (Math.abs(data[i]) > threshold) {
          lastAudibleFrame = Math.max(lastAudibleFrame, i);
          break;
        }
      }
    }

    const minFrames = Math.max(1, Math.floor(buffer.sampleRate * 0.1));
    const padFrames = Math.floor(buffer.sampleRate * tailPadSeconds);
    const targetFrames = lastAudibleFrame >= 0
      ? Math.min(buffer.length, lastAudibleFrame + padFrames + 1)
      : minFrames;

    if (targetFrames >= buffer.length) return buffer;

    let trimmed;
    if (window.AudioBuffer) {
      trimmed = new AudioBuffer({
        numberOfChannels: channels,
        length: targetFrames,
        sampleRate: buffer.sampleRate
      });
    } else {
      const OfflineCtor = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const tempCtx = new OfflineCtor(channels, targetFrames, buffer.sampleRate);
      trimmed = tempCtx.createBuffer(channels, targetFrames, buffer.sampleRate);
    }
    for (let channel = 0; channel < channels; channel++) {
      trimmed.copyToChannel(buffer.getChannelData(channel).slice(0, targetFrames), channel);
    }
    return trimmed;
  }

  async function audioBufferToNativeOgg(buffer, onStatus, unlockedCtx = null) {
    if (!window.MediaRecorder) throw new Error('Native OGG export is not supported in this browser.');
    const mimeType = [
      'audio/ogg;codecs=opus',
      'audio/ogg'
    ].find(type => MediaRecorder.isTypeSupported(type));
    if (!mimeType) throw new Error('Browser ini tidak support OGG export langsung.');

    onStatus?.('Encoding OGG with browser recorder...');
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    const ctx = unlockedCtx || new AudioCtor({ sampleRate: buffer.sampleRate });
    const source = ctx.createBufferSource();
    const destination = ctx.createMediaStreamDestination();
    const chunks = [];
    const recorder = new MediaRecorder(destination.stream, {
      mimeType,
      audioBitsPerSecond: 160000
    });

    source.buffer = buffer;
    source.connect(destination);

    const done = new Promise((resolve, reject) => {
      recorder.ondataavailable = event => {
        if (event.data && event.data.size > 0) chunks.push(event.data);
      };
      recorder.onerror = event => reject(event.error || new Error('Native OGG export failed.'));
      recorder.onstop = () => {
        if (!unlockedCtx) ctx.close?.();
        resolve(new Blob(chunks, { type: mimeType }));
      };
    });

    recorder.start();
    await ctx.resume();
    source.start();
    source.onended = () => {
      setTimeout(() => {
        if (recorder.state !== 'inactive') recorder.stop();
      }, 120);
    };

    return done;
  }

  const lameState = { loading: null, loaded: false };
  const opusRecorderState = { loading: null, loaded: false };

  function loadOpusRecorder(onStatus) {
    if (window.Recorder) return Promise.resolve(window.Recorder);
    if (opusRecorderState.loaded && window.Recorder) return Promise.resolve(window.Recorder);
    if (opusRecorderState.loading) return opusRecorderState.loading;

    onStatus?.('Loading local OGG encoder...');
    opusRecorderState.loading = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      const timeoutId = setTimeout(() => {
        script.remove();
        reject(new Error('OGG encoder timeout. Use MP3 export.'));
      }, 12000);
      script.src = 'vendor/opus-recorder/recorder.min.js';
      script.async = true;
      script.onload = () => {
        clearTimeout(timeoutId);
        if (!window.Recorder) {
          reject(new Error('OGG encoder loaded but is unavailable.'));
          return;
        }
        opusRecorderState.loaded = true;
        onStatus?.('OGG encoder ready.');
        resolve(window.Recorder);
      };
      script.onerror = () => {
        clearTimeout(timeoutId);
        reject(new Error('Could not load local OGG encoder.'));
      };
      document.head.appendChild(script);
    }).finally(() => {
      opusRecorderState.loading = null;
    });

    return opusRecorderState.loading;
  }

  async function audioBufferToOggOpus(buffer, onStatus, unlockedCtx = null) {
    const RecorderCtor = await loadOpusRecorder(onStatus);
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    const ctx = unlockedCtx || new AudioCtor({ sampleRate: 48000 });
    const source = ctx.createBufferSource();
    const destination = ctx.createMediaStreamDestination();
    const streamSource = ctx.createMediaStreamSource(destination.stream);
    let recorder = null;

    source.buffer = buffer;
    source.connect(destination);
    await ctx.resume();

    onStatus?.(`Encoding OGG ${formatStudioTime(buffer.duration)}... keep this tab open.`);

    return new Promise((resolve, reject) => {
      let finished = false;
      const timeoutId = setTimeout(() => {
        if (finished) return;
        finished = true;
        try { recorder?.close?.(); } catch (error) {}
        reject(new Error('OGG export timeout. Try MP3 export.'));
      }, Math.max(20000, (buffer.duration + 20) * 1000));

      recorder = new RecorderCtor({
        encoderPath: 'vendor/opus-recorder/encoderWorker.min.js',
        encoderBitRate: 160000,
        encoderSampleRate: 48000,
        numberOfChannels: 2,
        sourceNode: streamSource,
        streamPages: false
      });

      recorder.ondataavailable = arrayBuffer => {
        if (finished) return;
        finished = true;
        clearTimeout(timeoutId);
        try { recorder.close?.(); } catch (error) {}
        if (!unlockedCtx) ctx.close?.();
        resolve(new Blob([arrayBuffer], { type: 'audio/ogg' }));
      };
      recorder.onerror = error => {
        if (finished) return;
        finished = true;
        clearTimeout(timeoutId);
        try { recorder.close?.(); } catch (closeError) {}
        if (!unlockedCtx) ctx.close?.();
        reject(error || new Error('OGG export failed.'));
      };

      recorder.start().then(() => {
        source.start();
        source.onended = () => {
          setTimeout(() => {
            try { recorder.stop(); } catch (error) { reject(error); }
          }, 150);
        };
      }).catch(error => {
        clearTimeout(timeoutId);
        if (!unlockedCtx) ctx.close?.();
        reject(error);
      });
    });
  }

  function loadLameJs(onStatus) {
    if (window.lamejs?.Mp3Encoder) return Promise.resolve(window.lamejs);
    if (lameState.loaded && window.lamejs?.Mp3Encoder) return Promise.resolve(window.lamejs);
    if (lameState.loading) return lameState.loading;

    onStatus?.('Loading MP3 encoder...');
    lameState.loading = new Promise((resolve, reject) => {
      const urls = [
        'vendor/lame.all.js',
        'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js',
        'https://unpkg.com/lamejs@1.2.1/lame.min.js'
      ];
      let index = 0;

      const tryLoad = () => {
      const script = document.createElement('script');
        script.src = urls[index];
      script.async = true;
        const timeoutId = setTimeout(() => {
          script.remove();
          index += 1;
          if (index < urls.length) {
            tryLoad();
          } else {
            reject(new Error('MP3 encoder timeout. Internet/CDN blocked, use WAV Backup.'));
          }
        }, 12000);
      script.onload = () => {
          clearTimeout(timeoutId);
        if (!window.lamejs?.Mp3Encoder) {
            reject(new Error('MP3 encoder loaded but is unavailable.'));
          return;
        }
        lameState.loaded = true;
        onStatus?.('MP3 encoder ready.');
        resolve(window.lamejs);
      };
        script.onerror = () => {
          clearTimeout(timeoutId);
          script.remove();
          index += 1;
          if (index < urls.length) {
            tryLoad();
          } else {
            reject(new Error('Could not load MP3 encoder. Check internet/CDN access.'));
          }
        };
      document.head.appendChild(script);
      };

      tryLoad();
    }).finally(() => {
      lameState.loading = null;
    });

    return lameState.loading;
  }

  function floatToInt16Chunk(data, start, end) {
    const output = new Int16Array(end - start);
    for (let i = start; i < end; i++) {
      const sample = Math.max(-1, Math.min(1, data[i] || 0));
      output[i - start] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
    }
    return output;
  }

  async function audioBufferToMp3(buffer, onStatus) {
    const lame = await loadLameJs(onStatus);
    const channels = Math.min(2, buffer.numberOfChannels);
    const sampleRate = buffer.sampleRate;
    const kbps = 192;
    const encoder = new lame.Mp3Encoder(channels, sampleRate, kbps);
    const blockSize = 1152;
    const chunks = [];
    const left = buffer.getChannelData(0);
    const right = channels > 1 ? buffer.getChannelData(1) : left;

    onStatus?.('Encoding MP3...');
    for (let start = 0; start < buffer.length; start += blockSize) {
      const end = Math.min(buffer.length, start + blockSize);
      const leftChunk = floatToInt16Chunk(left, start, end);
      const encoded = channels > 1
        ? encoder.encodeBuffer(leftChunk, floatToInt16Chunk(right, start, end))
        : encoder.encodeBuffer(leftChunk);
      if (encoded.length) chunks.push(encoded);
      if (start % (blockSize * 120) === 0) {
        onStatus?.(`Encoding MP3 ${Math.min(99, Math.round((start / buffer.length) * 100))}%...`);
        await new Promise(resolve => setTimeout(resolve, 0));
      }
    }

    const finalChunk = encoder.flush();
    if (finalChunk.length) chunks.push(finalChunk);
    return new Blob(chunks, { type: 'audio/mpeg' });
  }

  function DJStudioSection() {
    const waveformRef = useRef(null);
    const visualizerRef = useRef(null);
    const audioCtxRef = useRef(null);
    const bufferRef = useRef(null);
    const sourceRef = useRef(null);
    const nodesRef = useRef(null);
    const timelineFrameRef = useRef(null);
    const visualFrameRef = useRef(null);
    const pauseOffsetRef = useRef(0);
    const startedAtRef = useRef(0);
    const controlsRef = useRef(DEFAULT_DJ_CONTROLS);

    const [trackName, setTrackName] = useState('Drop an audio file to arm the deck');
    const [duration, setDuration] = useState(0);
    const [currentTime, setCurrentTime] = useState(0);
    const [isReady, setIsReady] = useState(false);
    const [isPlaying, setIsPlaying] = useState(false);
    const [isExporting, setIsExporting] = useState(false);
    const [status, setStatus] = useState('Supports MP3, WAV, and M4A when your browser can decode it.');
    const [controls, setControls] = useState(DEFAULT_DJ_CONTROLS);

    useEffect(() => {
      controlsRef.current = controls;
      applyNodeValues(controls);
    }, [controls]);

    useEffect(() => {
      drawWaveform();
      drawVisualizerIdle();
      return () => {
        stopSourceOnly();
        cancelAnimationFrame(timelineFrameRef.current);
        cancelAnimationFrame(visualFrameRef.current);
      };
    }, []);

    function getAudioContext() {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) throw new Error('Web Audio API is not available in this browser.');
      if (!audioCtxRef.current) audioCtxRef.current = new AudioCtor();
      return audioCtxRef.current;
    }

    function getEffectiveRate(values = controlsRef.current) {
      return values.speed * Math.pow(2, values.pitch / 1200);
    }

    function getPlaybackTime(values = controlsRef.current) {
      const buffer = bufferRef.current;
      if (!buffer) return 0;
      if (!sourceRef.current || !audioCtxRef.current) return pauseOffsetRef.current;
      const elapsed = (audioCtxRef.current.currentTime - startedAtRef.current) * getEffectiveRate(values);
      return Math.min(buffer.duration, Math.max(0, pauseOffsetRef.current + elapsed));
    }

    function stopSourceOnly() {
      if (sourceRef.current) {
        try { sourceRef.current.onended = null; sourceRef.current.stop(0); } catch (e) {}
        try { sourceRef.current.disconnect(); } catch (e) {}
      }
      if (nodesRef.current) {
        Object.values(nodesRef.current).forEach(node => {
          if (node && node.disconnect) {
            try { node.disconnect(); } catch (e) {}
          }
        });
      }
      sourceRef.current = null;
      nodesRef.current = null;
      cancelAnimationFrame(timelineFrameRef.current);
      cancelAnimationFrame(visualFrameRef.current);
    }

    function applyNodeValues(values) {
      const nodes = nodesRef.current;
      const ctx = audioCtxRef.current;
      if (sourceRef.current && ctx) {
        sourceRef.current.playbackRate.setTargetAtTime(values.speed, ctx.currentTime, 0.015);
        sourceRef.current.detune.setTargetAtTime(values.pitch, ctx.currentTime, 0.015);
      }
      if (!nodes || !ctx) return;
      nodes.master.gain.setTargetAtTime(values.volume, ctx.currentTime, 0.02);
      nodes.bass.gain.setTargetAtTime(values.bass, ctx.currentTime, 0.02);
      nodes.treble.gain.setTargetAtTime(values.treble, ctx.currentTime, 0.02);
      nodes.lowPass.frequency.setTargetAtTime(values.lowPass, ctx.currentTime, 0.02);
      nodes.highPass.frequency.setTargetAtTime(values.highPass, ctx.currentTime, 0.02);
      nodes.echoGain.gain.setTargetAtTime(values.echo, ctx.currentTime, 0.02);
      nodes.feedback.gain.setTargetAtTime(Math.min(0.72, values.echo * 0.62), ctx.currentTime, 0.02);
      nodes.reverbGain.gain.setTargetAtTime(values.reverb, ctx.currentTime, 0.02);
    }

    function drawWaveform(marker = currentTime) {
      const canvas = waveformRef.current;
      if (!canvas) return;
      const dpr = window.devicePixelRatio || 1;
      const width = canvas.clientWidth || 900;
      const height = canvas.clientHeight || 170;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = 'rgba(2,4,8,0.86)';
      ctx.fillRect(0, 0, width, height);

      for (let i = 0; i < 12; i++) {
        ctx.strokeStyle = i % 3 === 0 ? 'rgba(0,240,255,0.09)' : 'rgba(255,255,255,0.035)';
        ctx.beginPath();
        ctx.moveTo((width / 12) * i, 0);
        ctx.lineTo((width / 12) * i, height);
        ctx.stroke();
      }

      const buffer = bufferRef.current;
      if (!buffer) {
        ctx.fillStyle = 'rgba(0,240,255,0.42)';
        ctx.font = '700 14px Rajdhani, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('IMPORT AUDIO TO DRAW WAVEFORM', width / 2, height / 2);
        return;
      }

      const data = buffer.getChannelData(0);
      const step = Math.ceil(data.length / width);
      const amp = height / 2;
      const wave = ctx.createLinearGradient(0, 0, width, 0);
      wave.addColorStop(0, '#00f0ff');
      wave.addColorStop(0.55, '#25d366');
      wave.addColorStop(1, '#7b2fff');
      ctx.strokeStyle = wave;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      for (let x = 0; x < width; x++) {
        let min = 1;
        let max = -1;
        for (let j = 0; j < step; j++) {
          const datum = data[(x * step) + j] || 0;
          if (datum < min) min = datum;
          if (datum > max) max = datum;
        }
        ctx.moveTo(x, (1 + min) * amp);
        ctx.lineTo(x, (1 + max) * amp);
      }
      ctx.stroke();

      const progress = buffer.duration ? Math.min(1, marker / buffer.duration) : 0;
      ctx.fillStyle = 'rgba(0,240,255,0.11)';
      ctx.fillRect(0, 0, width * progress, height);
      ctx.strokeStyle = 'rgba(255,255,255,0.75)';
      ctx.beginPath();
      ctx.moveTo(width * progress, 0);
      ctx.lineTo(width * progress, height);
      ctx.stroke();
    }

    function drawVisualizerIdle() {
      const canvas = visualizerRef.current;
      if (!canvas) return;
      const dpr = window.devicePixelRatio || 1;
      const width = canvas.clientWidth || 420;
      const height = canvas.clientHeight || 120;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = 'rgba(2,4,8,0.78)';
      ctx.fillRect(0, 0, width, height);
      for (let i = 0; i < 36; i++) {
        const barHeight = 8 + Math.sin(i * 0.8) * 5;
        ctx.fillStyle = 'rgba(0,240,255,0.12)';
        ctx.fillRect(i * (width / 36) + 3, height - barHeight - 10, width / 48, barHeight);
      }
    }

    function drawVisualizer() {
      const canvas = visualizerRef.current;
      const analyser = nodesRef.current && nodesRef.current.analyser;
      if (!canvas || !analyser) return;
      const dpr = window.devicePixelRatio || 1;
      const width = canvas.clientWidth || 420;
      const height = canvas.clientHeight || 120;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      const ctx = canvas.getContext('2d');
      const data = new Uint8Array(analyser.frequencyBinCount);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const render = () => {
        if (!sourceRef.current) {
          drawVisualizerIdle();
          return;
        }
        analyser.getByteFrequencyData(data);
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = 'rgba(2,4,8,0.7)';
        ctx.fillRect(0, 0, width, height);
        const bars = 48;
        const gap = 3;
        const barWidth = width / bars - gap;
        for (let i = 0; i < bars; i++) {
          const value = data[Math.floor((i / bars) * data.length)] / 255;
          const barHeight = Math.max(8, value * (height - 16));
          const gradient = ctx.createLinearGradient(0, height - barHeight, 0, height);
          gradient.addColorStop(0, i < bars * 0.65 ? '#00f0ff' : '#25d366');
          gradient.addColorStop(1, 'rgba(123,47,255,0.28)');
          ctx.fillStyle = gradient;
          ctx.fillRect(i * (barWidth + gap), height - barHeight, barWidth, barHeight);
        }
        visualFrameRef.current = requestAnimationFrame(render);
      };
      render();
    }

    function updateTimeline() {
      const tick = () => {
        const nextTime = getPlaybackTime();
        setCurrentTime(nextTime);
        drawWaveform(nextTime);
        if (sourceRef.current) timelineFrameRef.current = requestAnimationFrame(tick);
      };
      tick();
    }

    async function startPlayback(offset = pauseOffsetRef.current) {
      const buffer = bufferRef.current;
      if (!buffer) {
        setStatus('Import an audio file first.');
        return;
      }
      try {
        window.pauseSiteMusic?.();
        const ctx = getAudioContext();
        await ctx.resume();
        stopSourceOnly();
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.playbackRate.value = controlsRef.current.speed;
        source.detune.value = controlsRef.current.pitch;
        const nodes = createEffectGraph(ctx, source, controlsRef.current, ctx.destination, true);
        sourceRef.current = source;
        nodesRef.current = nodes;
        pauseOffsetRef.current = Math.min(offset, Math.max(0, buffer.duration - 0.01));
        startedAtRef.current = ctx.currentTime;
        source.onended = () => {
          if (getPlaybackTime() >= buffer.duration - 0.05) {
            stopSourceOnly();
            pauseOffsetRef.current = 0;
            setCurrentTime(0);
            setIsPlaying(false);
            drawWaveform(0);
            setStatus('Playback finished. Ready for another take.');
          }
        };
        source.start(0, pauseOffsetRef.current);
        setIsPlaying(true);
        setStatus('Live processing enabled. Tweak the deck in real-time.');
        updateTimeline();
        drawVisualizer();
      } catch (error) {
        setStatus(error.message || 'Could not start audio playback.');
      }
    }

    function pausePlayback() {
      if (!sourceRef.current) return;
      const nextTime = getPlaybackTime();
      pauseOffsetRef.current = nextTime;
      stopSourceOnly();
      setCurrentTime(nextTime);
      setIsPlaying(false);
      drawWaveform(nextTime);
      drawVisualizerIdle();
      setStatus('Paused. Resume keeps the current cue point.');
    }

    function stopPlayback() {
      stopSourceOnly();
      pauseOffsetRef.current = 0;
      setCurrentTime(0);
      setIsPlaying(false);
      drawWaveform(0);
      drawVisualizerIdle();
      setStatus(isReady ? 'Stopped. Cue returned to start.' : 'Import an audio file to begin.');
    }

    async function handleFileChange(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        stopPlayback();
        setStatus('Decoding audio...');
        const ctx = getAudioContext();
        const arrayBuffer = await file.arrayBuffer();
        const decoded = await ctx.decodeAudioData(arrayBuffer.slice(0));
        bufferRef.current = decoded;
        pauseOffsetRef.current = 0;
        setTrackName(file.name);
        setDuration(decoded.duration);
        setCurrentTime(0);
        setIsReady(true);
        setStatus('Audio loaded. Waveform is ready on Deck A.');
        requestAnimationFrame(() => drawWaveform(0));
      } catch (error) {
        setStatus('Could not decode this file. Try another MP3, WAV, or M4A.');
      }
    }

    function handleWaveformClick(event) {
      const buffer = bufferRef.current;
      const canvas = waveformRef.current;
      if (!buffer || !canvas) return;
      const rect = canvas.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
      const nextTime = ratio * buffer.duration;
      pauseOffsetRef.current = nextTime;
      setCurrentTime(nextTime);
      drawWaveform(nextTime);
      if (isPlaying) startPlayback(nextTime);
    }

    function updateControl(name, value) {
      const numericValue = Number(value);
      setControls(prev => {
        const next = { ...prev, [name]: numericValue };
        if (sourceRef.current && audioCtxRef.current) {
          pauseOffsetRef.current = getPlaybackTime(prev);
          startedAtRef.current = audioCtxRef.current.currentTime;
        }
        controlsRef.current = next;
        return next;
      });
    }

    function resetEffects() {
      controlsRef.current = DEFAULT_DJ_CONTROLS;
      setControls(DEFAULT_DJ_CONTROLS);
      setStatus('Effects reset to clean studio defaults.');
    }

    async function exportWav() {
      const buffer = bufferRef.current;
      if (!buffer) {
        setStatus('Import an audio file before exporting.');
        return;
      }
      try {
        setIsExporting(true);
        setStatus('Rendering WAV export...');
        const OfflineCtor = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        if (!OfflineCtor) throw new Error('Offline export is not supported in this browser.');
        const rate = Math.max(0.25, getEffectiveRate(controlsRef.current));
        const tailFrames = Math.floor(buffer.sampleRate * 2.5);
        const length = Math.ceil(buffer.length / rate) + tailFrames;
        const offline = new OfflineCtor(buffer.numberOfChannels, length, buffer.sampleRate);
        const source = offline.createBufferSource();
        source.buffer = buffer;
        source.playbackRate.value = controlsRef.current.speed;
        source.detune.value = controlsRef.current.pitch;
        createEffectGraph(offline, source, controlsRef.current, offline.destination, false);
        source.start(0);
        const rendered = trimAudioBufferSilence(await offline.startRendering());
        const wav = audioBufferToWav(rendered);
        const blob = new Blob([wav], { type: 'audio/wav' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const safeName = trackName.replace(/\.[^/.]+$/, '').replace(/[^\w-]+/g, '_') || 'dj-export';
        link.href = url;
        link.download = `${safeName}_norsdev_mix.wav`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        setStatus('Export complete. Empty ending removed from WAV mix.');
      } catch (error) {
        setStatus(error.message || 'Export failed.');
      } finally {
        setIsExporting(false);
      }
    }

    const controlList = [
      { key: 'volume', label: 'Volume', min: 0, max: 1.2, step: 0.01, display: `${Math.round(controls.volume * 100)}%` },
      { key: 'pitch', label: 'Pitch', min: -1200, max: 1200, step: 1, display: `${controls.pitch > 0 ? '+' : ''}${controls.pitch} ct` },
      { key: 'speed', label: 'Tempo', min: 0.5, max: 1.5, step: 0.01, display: `${controls.speed.toFixed(2)}x` },
      { key: 'bass', label: 'Bass', min: -18, max: 18, step: 0.5, display: `${controls.bass > 0 ? '+' : ''}${controls.bass} dB` },

  }

  const ADVANCED_DEFAULT_CONTROLS = {
    volume: 0.9,
    pitch: 0,
    speed: 1,
    bass: 0,
    treble: 0,
    eqMid: 0,
    reverb: 0,
    echo: 0,

    highPass: 20,

  };

  const SFX_LIBRARY = [
    ['air_horn', 'Air Horn', 'hype'],
    ['explosion', 'Explosion', 'impact'],
    ['bass_drop', 'Bass Drop', 'drop'],
    ['crowd', 'Crowd Cheering', 'crowd'],
